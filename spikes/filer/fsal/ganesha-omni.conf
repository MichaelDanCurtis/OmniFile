# NFS-Ganesha config for the FSAL_OMNI spike (part B). Throwaway.
NFS_CORE_PARAM {
	Protocols = 3, 4;
	NFS_Port = 2049;
	Enable_NLM = false;
	Enable_RQUOTA = false;
}
NFSV4 {
	Minor_Versions = 0, 1, 2;
	Graceless = true;
	RecoveryBackend = fs;
}
MDCACHE {
	# Keep attribute caching default; data is never cached by MDCACHE.
}
LOG {
	Default_Log_Level = EVENT;
	Components { FSAL = EVENT; }
}
EXPORT_DEFAULTS {
	Access_Type = RW;
	Squash = No_Root_Squash;
	SecType = sys;
	Protocols = 3, 4;
	Transports = TCP;
}
EXPORT {
	Export_Id = 101; Path = /srv/omni-b/data/wait; Pseudo = /omni/wait;
	FSAL { Name = OMNI; Policy = "wait"; Socket = "/run/omnifile/fsal.sock"; Timeout_Ms = 2000;
		FSAL { Name = VFS; } }
}
EXPORT {
	Export_Id = 102; Path = /srv/omni-b/data/failfast; Pseudo = /omni/failfast;
	FSAL { Name = OMNI; Policy = "failfast"; Socket = "/run/omnifile/fsal.sock"; Timeout_Ms = 2000;
		FSAL { Name = VFS; } }
}
EXPORT {
	Export_Id = 103; Path = /srv/omni-b/data/quick; Pseudo = /omni/quick;
	FSAL { Name = OMNI; Policy = "waitquick:5000"; Socket = "/run/omnifile/fsal.sock"; Timeout_Ms = 2000;
		FSAL { Name = VFS; } }
}
EXPORT {
	# upstream FSAL_NULL over VFS: isolates the cost of stacking from the guard
	Export_Id = 202; Path = /srv/omni-b/data/null; Pseudo = /null;
	FSAL { Name = NULL; FSAL { Name = VFS; } }
}
EXPORT {
	Export_Id = 201; Path = /srv/omni-b/plain; Pseudo = /plain;
	FSAL { Name = VFS; }
}
