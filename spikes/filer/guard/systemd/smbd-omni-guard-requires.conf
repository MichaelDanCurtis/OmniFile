# /etc/systemd/system/smbd.service.d/omni-guard.conf  (variant B: no BindsTo)
# Explicit stop/restart of the guard stops/restarts smbd (Requires=), smbd starts only after the
# guard reported READY (After=), but a guard crash + automatic restart does NOT take smbd down:
# the fanotify group survives in the fd store, so smbd reads simply wait.
[Unit]
Requires=omni-guard-a.service
After=omni-guard-a.service
