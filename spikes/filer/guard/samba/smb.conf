# Samba config for the filer spike, part A (loopback only, throwaway VM).
[global]
   server role = standalone server
   workgroup = OMNISPIKE
   interfaces = lo
   bind interfaces only = yes
   smb ports = 445
   map to guest = never
   log file = /var/log/samba/log.%m
   log level = 1
   server min protocol = SMB2_10
   disable netbios = yes
   load printers = no
   # defaults kept on purpose: aio read size = 1 (reads go through the pthreadpool),
   # use sendfile = no, no vfs_io_uring.

[omni]
   path = /srv/omni-a/data
   read only = no
   valid users = geo1 geo2
