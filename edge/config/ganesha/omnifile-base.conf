# NFS-Ganesha + FSAL_OMNI: the appliance's base configuration (everything but
# the EXPORT blocks). omnifile-setup installs it as /etc/ganesha/omnifile-base.conf;
# /etc/ganesha/ganesha.conf includes it and /etc/ganesha/omnifile-exports.conf,
# which includes the exports the daemon renders.
#
# The same as the dev base (dev/edge/ganesha-base.conf) except for the grace
# period and NFSv3 locking: on the appliance, NFS clients ride grace across a
# restart (an update applied in the maintenance window), reclaiming their
# state instead of losing locks and opens. Dev and the e2e tests run
# graceless, without NLM (their NFSv3 mounts use nolock), to save time.

# NFSv3 locking (NLM): without it, tools on NFSv3 mounts that take fcntl locks
# (HDF5, SQLite) fail unless the client mounts with nolock. NLM needs, next to
# Ganesha: rpcbind, rpc.statd (Ganesha registers each locking client with it,
# SM_MON, and refuses the lock when it cannot), and `sm-notify -f` each time
# Ganesha starts, before Ganesha unmonitors every client, so the clients that
# held locks reclaim them in grace. /var/lib/nfs (statd's sm/ and Ganesha's
# v4recov/) must persist across reboots and updates. The cost: with NLM on,
# Ganesha cannot end grace early (it cannot tell when every NLM client has
# reclaimed), so every restart holds new NFSv4 opens and locks, and NFSv3
# truncates, for the whole Grace_Period (90 s). tests/e2e/nfs_grace_test.sh;
# docs/milestones/results/wp3.md, "NLM".
NFS_CORE_PARAM {
	Protocols = 3, 4;
	NFS_Port = 2049;
	# NFSv3 locking is on (the owner, 2026-11-04), and every NFSv3 port is fixed, so a site
	# firewall can allow exactly these (the appliance's own firewall does): MOUNT 20048 and
	# NLM 32803, tcp and udp; rpc.statd is 32765 (appliance/mkosi.extra, rpc-statd.service.d).
	Enable_NLM = true;
	MNT_Port = 20048;
	NLM_Port = 32803;
	Enable_RQUOTA = false;
}

NFSV4 {
	Minor_Versions = 0, 1, 2;
	Graceless = false;
	RecoveryBackend = fs;
	# Where the fs backend keeps the clients allowed to reclaim (v4recov/, v4old/). The
	# appliance's Ganesha build already defaults to this path, so on the appliance the
	# line changes nothing. The dev build (prefix /opt/ganesha) defaults to
	# /opt/ganesha/var/lib/nfs/ganesha; naming the path here makes every build keep
	# the records in the same place, under /var/lib/nfs, which persists.
	RecoveryRoot = "/var/lib/nfs/ganesha";
}

# Close_Fast: Ganesha's fd cache would otherwise keep an NFSv3 writer's fd open
# indefinitely, and the stub handshake's write-lease check (F_SETLEASE) would
# then never let a file written over NFSv3 become a stub (M1 e2e finding).
MDCACHE {
	Close_Fast = true;
}

LOG {
	Default_Log_Level = EVENT;
	Components { FSAL = INFO; }
}

OMNI {
	Socket_Path = "/run/omnifile/fsal.sock";
}
