[package]
name = "omnifile-stub"
description = "OmniFile Gateway placeholders, the stub handshake and recall fill (docs/design/fsal-namespace.md §5)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
omnifile-integrity = { path = "../omnifile-integrity" }
omnifile-marker = { path = "../omnifile-marker" }
omnifile-replica = { path = "../omnifile-replica" }
# Filesystem syscalls (O_TMPFILE, linkat, fallocate, renameat2, leases). MIT OR Apache-2.0.
libc = "0.2"
# Error types. MIT OR Apache-2.0.
thiserror = "2"
# Structured logging. MIT.
tracing = "0.1"
# spawn_blocking for filesystem work off the async workers. MIT.
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
