[package]
name = "omnifile-acl"
description = "OmniFile Gateway edge POSIX ACLs: share Owners/Writers/Readers as root access + default ACLs, ACL snapshots (SIDs) for the control API, drift detection, Samba/Ganesha share config (decision 28)"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
omnifile-identity = { path = "../omnifile-identity" }
# Raw xattr syscalls for system.posix_acl_* (no libacl). MIT OR Apache-2.0.
libc = "0.2"
# SHA-256 of the canonical ACL form (already in the workspace via rustls). Apache-2.0 AND ISC.
ring = "0.17"
# Control-API payloads. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Error types. MIT OR Apache-2.0.
thiserror = "2"
# Structured logging. MIT.
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
proptest = "1"
# The stub/fill path, to prove it leaves ownership, mode and ACLs alone
# (tests/stub_preserves_acl.rs, Linux + root + xfs).
omnifile-stub = { path = "../omnifile-stub" }
omnifile-marker = { path = "../omnifile-marker" }
omnifile-integrity = { path = "../omnifile-integrity" }
tokio = { version = "1", features = ["rt", "macros"] }

[[example]]
# The permission matrix's CLI (tests/acl/matrix.sh).
name = "omniacl"
