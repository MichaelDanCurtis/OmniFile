[package]
name = "omnifile-detect"
description = "OmniFile Gateway edge write detector: fanotify FAN_CLOSE_WRITE plus a quiet period on the landing filesystem"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fanotify", "fs"] }
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3"
