[package]
name = "omnifile-blob"
description = "OmniFile Gateway edge Azure Blob data-plane client over user-delegation SAS URLs: Put Block with CRC64, Put Block List, ranged Get, resumable uploads"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
omnifile-integrity = { path = "../omnifile-integrity" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "macros", "net"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
fastrand = "2"
# M5 S3 reader. No aws-lc and no OpenSSL in its tree (checked with
# `cargo tree -i aws-lc-sys` / `-i openssl-sys`).
aws-sigv4 = { version = "1", default-features = false, features = ["sign-http", "http1"] }
# The credential and identity types aws-sigv4 signs with (already in its tree).
aws-credential-types = "1"
aws-smithy-runtime-api = { version = "1", default-features = false, features = ["client"] }
# RFC 3339 `Expiration` from the credential helper.
time = { version = "0.3", features = ["parsing"] }

[features]
# `cargo test -p omnifile-blob --features floci`: the floci-aws-edge lane.
floci = []

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "net"] }
tempfile = "3"
libc = "0.2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
base64 = "0.22"
