[package]
name = "omnifile-setup"
description = "OmniFile Gateway edge setup wizard: network, data disk, AD join, enrolment, updates"
edition.workspace = true
version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "omnifile-setup"
path = "src/main.rs"

[dependencies]
# The smb.conf checks the daemon applies to shares (decision 28). BUSL-1.1 (ours).
omnifile-acl = { path = "../omnifile-acl" }
# Answers file. MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Terminal echo off for the join password. MIT OR Apache-2.0.
libc = "0.2"
# The IAM Roles Anywhere key and its certificate request (made in memory,
# sealed by systemd-creds), and checking the certificate the CA returns.
# MIT OR Apache-2.0 (rcgen, x509-parser, zeroize), as omnifile-control uses them.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.18"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
# Test certificates' validity periods, and a test CA that signs the filer's request.
time = "0.3"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
