# /usr/lib/systemd/system/smbd.service.d/10-omnifile-guard.conf
#
# smbd never serves the volume without an armed smb-guard
# (docs/pilots/filer-spike-results-A.md, recommended design 3):
# - Requires= + After=: starting smbd starts the guard first, and smbd starts
#   only after the guard's READY=1, which it sends once its mark is armed (A11:
#   smbd started 116 ms after READY);
# - BindsTo=: an explicit stop, or a permanent failure (start limit) of the
#   guard, stops smbd first. A crash does not: the guard unit uses
#   RestartMode=direct, so it never passes through failed/inactive, smbd
#   keeps its PID, and waiting SMB reads complete after the restart (A11).
#
# Every file smbd opens while no group exists is unguarded for life (A9):
# that is why smbd must not start, or keep running, without the guard.

[Unit]
Requires=omnifile-edge.service
BindsTo=omnifile-edge.service
After=omnifile-edge.service
