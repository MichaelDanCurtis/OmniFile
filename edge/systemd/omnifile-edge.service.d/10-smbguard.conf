# /usr/lib/systemd/system/omnifile-edge.service.d/10-smbguard.conf
#
# The smb-guard's requirements on the unit that holds its fanotify group.
# The guard runs inside omnifile-edge (edge/crates/omnifile-smbguard), so this
# is a drop-in for the daemon's unit (edge/crates/omnifile-edge/systemd/).
# Every line traces to docs/pilots/filer-spike-results-A.md, "Recommended
# design"; the A-suite (edge/crates/omnifile-smbguard/tests/a-suite) installs
# this file verbatim (paths substituted) on its test unit.
#
# INSTALL ONLY ONCE THE DAEMON STARTS THE GUARD (M2 integration): Type=notify
# makes systemd wait for READY=1, which the guard sends once its mark is armed.

[Unit]
# Never mark an unmounted path: the guard also checks the xfs UUID itself,
# but without the mount an empty directory on / would be "the volume".
RequiresMountsFor=/srv/omnifile/data
# Servers start only after READY (their own drop-ins add Requires/BindsTo/After).
Before=smbd.service nfs-ganesha-omni.service
# Crash bursts keep restarting: while the guard is down its group (in the fd
# store) holds every read, so giving up would only turn a stall into an
# outage. A start-limit failure would still keep the store (A6h).
StartLimitIntervalSec=0

[Service]
# READY=1 only after the FAN_MARK_FILESYSTEM mark is armed and verified on
# the right filesystem, the fill-mount ignore mark is set, orphans are
# reserved and the sweep is done.
Type=notify
NotifyAccess=main
# The group lives here, created once (FDSTORE=1, FDNAME=omnifile-guard-<id>,
# FDPOLL=0) and handed back on every restart. Preserve=yes keeps it across
# stop/start, but ONLY while the unit stays referenced: an inactive unit that
# nothing references is garbage-collected with its store (A6c-1). The package
# ships /usr/lib/systemd/system/multi-user.target.wants/omnifile-edge.service,
# which `systemctl disable` cannot remove (see install.sh).
FileDescriptorStoreMax=64
FileDescriptorStorePreserve=yes
Restart=always
RestartSec=1
# A crash goes straight back to "activating" without passing through
# failed/inactive, so smbd and Ganesha (BindsTo=) are not stopped (A11).
RestartMode=direct
# Every in-flight event holds a descriptor (two with FAN_REPORT_PIDFD); the
# guard caps in-flight events below this and never exits on EMFILE (A8).
LimitNOFILE=1048576
# The private fill mount (recommended design 6): a bind of the volume that
# only this process's mount namespace can see. The guard verifies it is a
# separate mount object in a namespace other than PID 1's, and puts a mount
# ignore mark on it, so fills and re-stubs raise no events.
PrivateMounts=yes
BindPaths=/srv/omnifile/data:/run/omnifile-fill
# The event journal: tmpfs, kept across restarts (events don't survive a
# reboot either).
RuntimeDirectory=omnifile/smbguard
RuntimeDirectoryPreserve=yes
# Stop: SIGTERM to the daemon only. The group stays in the store, so reads
# wait through a stop and are answered by the next instance.
KillMode=mixed
