# /usr/lib/systemd/system/nfs-ganesha-omni.service.d/10-omnifile-guard.conf
#
# Ganesha under the smb-guard, as smbd (smbd.service.d/10-omnifile-guard.conf).
# fsal/systemd/nfs-ganesha-omni.service carries the same three lines; this
# drop-in keeps the guarantee if that unit is ever edited or replaced. The
# guard's filesystem mark is also FSAL_OMNI's second layer: a Ganesha read of
# a hole the FSAL wrongly let through raises an event the guard denies
# (docs/design/fsal-namespace.md §6, "Second layer").

[Unit]
Requires=omnifile-edge.service
BindsTo=omnifile-edge.service
After=omnifile-edge.service
