# NFS-Ganesha + FSAL_OMNI: the appliance's base configuration (everything but
# the EXPORT blocks). Installed as /etc/ganesha/omnifile-base.conf by
# dev/scripts/install-ganesha.sh; /etc/ganesha/ganesha.conf includes it and
# adds the exports.

NFS_CORE_PARAM {
	Protocols = 3, 4;
	NFS_Port = 2049;
	Enable_NLM = false;
	Enable_RQUOTA = false;
}

NFSV4 {
	Minor_Versions = 0, 1, 2;
	Graceless = true;
	RecoveryBackend = fs;
}

# Close_Fast: Ganesha's fd cache would otherwise keep an NFSv3 writer's fd open
# indefinitely, and the stub handshake's write-lease check (F_SETLEASE) would
# then never let a file written over NFSv3 become a stub (M1 e2e finding).
MDCACHE {
	Close_Fast = true;
}

LOG {
	Default_Log_Level = EVENT;
	Components { FSAL = INFO; }
}

OMNI {
	Socket_Path = "/run/omnifile/fsal.sock";
}
