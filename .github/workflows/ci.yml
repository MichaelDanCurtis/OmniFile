name: CI

# Manual only: the repo has no GitHub-hosted runners (owner's choice, for cost),
# so lanes run locally. Run this one from the Actions tab when runners exist.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    name: edge (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: edge
      # The blob and control-client tests drive the sim Azure Blob facade
      # (python -m omnifile_service.backends.sim_http) through uv; require them.
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --project ../service
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
        env:
          OMNIFILE_REQUIRE_SIM: "1"

  service:
    name: service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    services:
      # Catalog tests (migrations, PGMQ, triggers) need a real Postgres.
      # 17 is what we deploy on Azure Flexible Server; 16 is the minimum.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omnifile
          POSTGRES_PASSWORD: omnifile
          POSTGRES_DB: omnifile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnifile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIFILE_TEST_DATABASE_URL: postgresql://omnifile:omnifile@localhost:5432/omnifile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -rs
