# What a release is published to and signed with (owner decisions, 2026-10-21):
# B: the update feed is on GitHub Releases; the update-signing key is in Azure Key Vault
#    Premium (EC-HSM P-256, not exportable) and signs only in appliance/release.sh.
# C: Secure Boot is optional in v1; UKIs and systemd-boot are signed with OmniFile's own
#    key, also in Key Vault Premium (docs/design/secure-boot.md).
# Sourced by build.sh and release.sh; each value can be overridden on their command lines.

# The GitHub repository whose Releases carry the feed. A box downloads anonymously, so the
# repository (or a release mirror of it) must be public: assets of a private repository
# answer 404 without a token. VERIFY with the owner which repository that is.
RELEASE_REPO=MichaelDanCurtis/OmniFile-Gateway
# systemd-sysupdate's source: the latest release's assets. GitHub answers
# releases/latest/download/<file> with a redirect to that release's asset.
FEED_URL=https://github.com/$RELEASE_REPO/releases/latest/download/
# The public repository whose GitHub Release v<version> carries each release's GPL and LGPL
# source (decision 46; appliance/source-offer/). The written offer installed in every image
# (build.sh: /usr/share/doc/omnifile/GPL-SOURCE-OFFER.txt) names it, so it must be the one
# source_offer.py --sources-repo publishes to. VERIFY with the owner, who creates it at the
# first release.
SOURCES_REPO=${RELEASE_REPO%%/*}/omnifile-gateway-sources

# The update-signing key (pgp_kv.py kv:<key id>), pinned to one version: without a version
# Key Vault signs with the latest, and a rotation would then sign feeds no installed box
# accepts (Codex on #31). VERIFY: the vault, key and version are the owner's (Key Vault
# Premium, EC-HSM, P-256, operations sign/verify only); the version below is a placeholder.
UPDATE_KEY=kv:https://omnifile-release.vault.azure.net/keys/update-signing/00000000000000000000000000000000
# The keyring every image embeds (build.sh --pubring), made once from that key version
# (pgp_kv.py pubkey). release.sh refuses to sign unless the signer's key is in it, and the
# booted image's own keyring holds it too.
UPDATE_RING=appliance/keys/omnifile-updates.pgp
# Its OpenPGP creation time: part of its fingerprint. Fixed once, when the keyring that goes
# into the image is made (pgp_kv.py pubkey), and never changed after.
UPDATE_KEY_CREATED=1792540800
UPDATE_KEY_UID="OmniFile Gateway updates <updates@omnifile.invalid>"

# The Secure Boot signing key for UKIs and systemd-boot (an RSA-HSM 2048 key: UEFI
# firmware verifies RSA-2048/SHA-256 Authenticode), through the Azure Key Vault OpenSSL
# engine (e_akv, github.com/microsoft/AzureKeyVaultManagedHSMEngine): vault:<vault>:<key>.
# Its certificate, the db entry clients enrol, is public and kept in appliance/keys/.
UKI_KEY=kv:omnifile-release:uki-signing
# The same key's full id with its version, which release.sh checks (az keyvault key show)
# is the key of UKI_CERT before signing; sbverify then checks each signature against it.
UKI_KEY_ID=https://omnifile-release.vault.azure.net/keys/uki-signing/00000000000000000000000000000000
UKI_CERT=appliance/keys/omnifile-secure-boot-db.crt
