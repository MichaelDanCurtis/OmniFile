# Slot A: this version's /usr, read-only, verity-protected. Fixed size, so any later
# version written into the other slot fits too.
[Partition]
Type=usr
Label=%M_%A
CopyFiles=/usr:/
Format=erofs
Verity=data
VerityMatchKey=usr
SizeMinBytes=3G
SizeMaxBytes=3G
# The split file carries the partition UUID, which sysupdate gives the slot it writes
# (@u in sysupdate.d/20-usr.transfer): the UKI's usrhash= finds /usr by that UUID.
SplitName=%t.%U
