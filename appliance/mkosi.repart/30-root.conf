# /etc and /var: this box's state. Grown to fill the disk at first boot
# (mkosi.extra/usr/lib/repart.d/30-root.conf). The shares' data volume is a separate
# disk, set up by the setup wizard, never part of the image.
[Partition]
Type=root
Format=ext4
CopyFiles=/
ExcludeFiles=/usr/
SizeMinBytes=2G
# Not served to updates: never split out.
SplitName=-
