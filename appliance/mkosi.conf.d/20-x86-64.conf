# The product's architecture: the console on the first serial port as well as the screen.
[Match]
Architecture=x86-64

[Content]
KernelCommandLine=console=tty0 console=ttyS0
# No CPU microcode in the UKI: a VM can't load it (the hypervisor's host does), and mkosi's
# microcode cpio carries the build's own time on its directories, which made two builds' UKIs
# differ (reproducible builds, docs/design/appliance-image.md). Removed before mkosi builds it.
RemoveFiles=/usr/lib/firmware/amd-ucode
        /usr/lib/firmware/intel-ucode
