# The arm64 test build (build.sh --arch arm64): qemu's virt machine, under HVF on Apple
# silicon or KVM on an arm64 host. Its serial port is a PL011, ttyAMA0.
[Match]
Architecture=arm64

[Content]
KernelCommandLine=console=tty0 console=ttyAMA0
# Ubuntu's arm64 vmlinuz wraps the kernel in a stub image, which systemd-stub can't start from a
# UKI: the UKI is built from the kernel inside it (mkosi.arm64/unwrap-kernel.py says why).
PostInstallationScripts=mkosi.arm64/unwrap-kernel.py
