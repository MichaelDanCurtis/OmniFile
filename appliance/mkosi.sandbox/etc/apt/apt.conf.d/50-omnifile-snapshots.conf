// mkosi.conf pins Snapshot= (reproducible builds). apt knows snapshot.ubuntu.com for
// archive.ubuntu.com and security.ubuntu.com, but not for ports.ubuntu.com, where mkosi takes
// arm64 packages from ("Snapshots not supported for http://ports.ubuntu.com/ resolute").
// snapshot.ubuntu.com serves every architecture under /ubuntu (checked 2026-11-03: the
// arm64 indexes and pool files of 20261020T000000Z are there; /ubuntu-ports answers 401).
// Used by mkosi's own apt only (mkosi.sandbox/), never in the image.
Acquire::Snapshots::URI::Host::ports.ubuntu.com "https://snapshot.ubuntu.com/ubuntu/@SNAPSHOTID@/";
