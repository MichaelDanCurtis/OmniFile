# The appliance's state lives outside /usr (decision 38): /usr is read-only and replaced
# whole by an update. Ganesha's build expects /opt/ganesha: point it into the active /usr.
L+ /opt/ganesha - - - - /usr/lib/omnifile/ganesha
d /etc/omnifile 0755 root root -
d /var/lib/omnifile 0755 root root -
d /var/lib/omnifile/identity 0700 root root -
d /var/lib/omnifile/outbox 0700 root root -
d /var/lib/omnifile/kernel-check 0700 root root -
d /run/omnifile-fill 0755 root root -
d /srv/omnifile/data 0755 root root -
# NFS-Ganesha's NFSv4 recovery root (its clients' grace records, RecoveryBackend = fs) on the
# root partition, so clients reclaim their state after a reboot or an A/B update. Ganesha's
# compiled default, /opt/ganesha/var/lib/nfs/ganesha, resolves here too (build.sh).
d /var/lib/nfs 0755 root root -
d /var/lib/nfs/ganesha 0755 root root -
# NLM (on: the owner, 2026-11-04): rpc.statd's record of the clients that hold locks, and sm-notify's
# list of those still to notify, on the root partition too.
d /var/lib/nfs/sm 0700 statd nogroup -
d /var/lib/nfs/sm.bak 0700 statd nogroup -
# The break-glass account's home, and setup's record of its use.
d /var/lib/omnifile-recovery 0700 omnifile-recovery omnifile-recovery -
d /var/lib/omnifile/recovery 0700 root root -
