# smbd restarts after a crash (Ubuntu's unit has no Restart=; a 6.75 h chaos soak found
# SMB down for good after one). It stays bound to the smb-guard
# (10-omnifile-guard.conf): a restart is a start, which requires the guard and waits for it,
# so smbd never comes back while the guard is down. A stop of the guard (BindsTo=) is not a
# failure, so it isn't restarted then either.
[Unit]
# At most 5 starts in 10 minutes: a server that keeps crashing ends failed (systemctl --failed),
# not in a restart loop.
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
