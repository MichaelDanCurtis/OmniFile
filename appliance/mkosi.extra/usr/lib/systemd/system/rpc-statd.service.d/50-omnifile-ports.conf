# NFSv3 locking (NLM, on: the owner, 2026-11-04). rpc.statd on fixed ports, so a site firewall
# (and the appliance's, omnifile-firewall.service) can allow exactly them; rpcbind would
# otherwise hand out new ones at every start. Here rather than in /etc/nfs.conf, so an A/B
# update carries it with /usr. Ganesha's MOUNT and NLM ports are in its base config.
[Service]
ExecStart=
ExecStart=/usr/sbin/rpc.statd --port 32765 --outgoing-port 32766
