# Users a release adds (sysusers.d in /usr: statd, omnifile-recovery) must reach a box whose
# /etc came from an older image, and an A/B update runs no package scripts. systemd-sysusers
# runs only when /usr is newer than /etc/.updated (ConditionNeedsUpdate), which compares
# mtimes: reproducible builds date /usr by SOURCE_DATE_EPOCH, so a new /usr can look older
# than the image the box was installed from (the update round from a pre-WP2 image found no
# statd user). It is idempotent, so it runs at every boot: the empty assignment resets its
# conditions.
[Unit]
ConditionNeedsUpdate=
