# nmbd (NetBIOS names; off unless a site turns it on) restarts after a crash, as smbd does.
# It serves no files, so it isn't bound to the guard.
[Unit]
# At most 5 starts in 10 minutes: a server that keeps crashing ends failed (systemctl --failed),
# not in a restart loop.
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
