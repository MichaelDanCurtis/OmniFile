# /etc/ld.so.cache is on the root partition and describes the libraries of the /usr it was made
# for. ldconfig.service runs only when /usr is newer than /etc/.updated (ConditionNeedsUpdate),
# a comparison of mtimes that reproducible builds fix to SOURCE_DATE_EPOCH, so after an A/B
# update it can be skipped and the cache left describing the old /usr. It takes well under a
# second: it runs at every boot (the empty assignment resets its conditions).
[Unit]
ConditionNeedsUpdate=
