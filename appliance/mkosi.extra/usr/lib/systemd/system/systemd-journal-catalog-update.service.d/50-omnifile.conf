# The journal's message catalog (/var/lib/systemd/catalog) is built from /usr's catalog files,
# and its ConditionNeedsUpdate=/var compares mtimes that reproducible builds fix, so an A/B
# update can skip it. It is cheap: it runs at every boot (the empty assignment resets its
# conditions). systemd-hwdb-update needs nothing: the image ships /usr/lib/udev/hwdb.bin,
# which udev reads and an update replaces with /usr.
[Unit]
ConditionNeedsUpdate=
