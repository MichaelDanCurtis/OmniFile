# NFSv3 locking (NLM; on: the owner, 2026-11-04).
# Ganesha's NLM monitors clients through rpc.statd, and after a restart sm-notify tells every
# client that held a lock to reclaim it within the grace period.
#
# The "+" runs sm-notify with full privileges: under Ganesha's CapabilityBoundingSet it can't
# drop to the statd user, and exits without notifying anyone (WP3 measured NFSv3 locks lost
# across a restart without it). "-": a failed notify doesn't stop Ganesha from serving.
[Unit]
Wants=rpc-statd.service
After=rpc-statd.service

[Service]
ExecStartPre=-+/usr/sbin/sm-notify -f
