# Ganesha's own unit (fsal/systemd/nfs-ganesha-omni.service) already restarts it on failure, 2 s
# apart; that stays, so NFS recovers as fast as before. This adds only the start limit smbd has:
# at most 5 starts in 10 minutes, then it stays failed (systemctl --failed) instead of looping.
# It stays bound to the guard (10-omnifile-guard.conf): a restart is a start, which requires the
# guard and waits for it.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=2
