# On the appliance the annex supervisor starts once the edge is set up and enrolled: it reads
# the setup wizard's config and asks the service, as the enrolled edge, which annexes are
# this edge's. Before that the unit is skipped, not restarted every 10 s forever (its
# StartLimitIntervalSec=0). Setup's services step starts it (the first boot, WP14 A2.3).
[Unit]
ConditionPathExists=/etc/omnifile/edge.toml
ConditionPathExists=/var/lib/omnifile/identity/identity.json
