# winbind is the one identity source for SMB and NFS (AD users and groups): it restarts after a
# crash. It serves no files, so it isn't bound to the guard; smbd and Ganesha keep their
# guard binding whatever winbind does.
[Unit]
# At most 5 starts in 10 minutes: a server that keeps crashing ends failed (systemctl --failed),
# not in a restart loop.
StartLimitIntervalSec=600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=5
