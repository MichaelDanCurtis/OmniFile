# openssh-server's first-boot keygen (ssh-keygen -A) would race omnifile-ssh-keygen.service,
# which replaces keys the box didn't make itself: two writers can leave a private key and a
# .pub that don't match. omnifile-ssh-keygen is the only generator; this one never starts.
[Unit]
ConditionPathExists=/nonexistent/omnifile-ssh-keygen-makes-the-keys
