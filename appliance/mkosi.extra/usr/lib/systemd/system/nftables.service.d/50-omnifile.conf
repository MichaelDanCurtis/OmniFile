# Ubuntu's nftables.service loads /etc/nftables.conf, which starts with `flush ruleset` and
# then accepts everything, and its ExecStop flushes too: started (enabled by its postinst, or
# by hand), it would wipe the appliance's firewall (omnifile-firewall.service). It never
# starts here, whatever /etc says (the preset disables it as well).
[Unit]
ConditionPathExists=/nonexistent/omnifile-firewall-owns-nftables
