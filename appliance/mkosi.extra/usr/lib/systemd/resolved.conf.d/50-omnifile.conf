# The appliance resolves names through the site's DNS (DHCP or the setup wizard's servers)
# and needs neither LLMNR (5355) nor mDNS (5353). Off, resolved listens only on its loopback
# stub (127.0.0.53), so it opens no port on the network, before the firewall or after.
[Resolve]
LLMNR=no
MulticastDNS=no
