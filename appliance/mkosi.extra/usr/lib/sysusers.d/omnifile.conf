# The break-glass account (access-control.md 8; docs/design/setup-wizard.md):
# created locked. The setup wizard seals it with a password shown once, and it
# logs in on the console only (sshd DenyUsers). Every session is recorded.
u! omnifile-recovery - "OmniFile recovery (break-glass)" /var/lib/omnifile-recovery /bin/bash
# rpc.statd (NFSv3 lock recovery) drops to this user. nfs-common's postinst makes it in a new
# image's /etc; an A/B update runs no postinst, so a box updated from an image without
# nfs-common gets it here (systemd-sysusers runs at every boot: its drop-in).
u statd -:nogroup "rpc.statd, NFSv3 lock recovery" /var/lib/nfs /usr/sbin/nologin
