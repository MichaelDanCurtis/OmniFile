# The OmniFile edge appliance image (decision 38; docs/design/appliance-image.md).
#
# Ubuntu 26.04 LTS, minimized (decision 26), as a GPT disk image built by mkosi:
# - /usr is its own read-only erofs partition, with a dm-verity hash partition. mkosi
#   writes the hash (usrhash=) into the UKI's kernel command line, so each UKI boots
#   exactly its own /usr.
# - A second, empty /usr slot (B) and verity slot are in the image from the start.
#   systemd-sysupdate writes a new version into whichever slot is inactive, plus a new
#   UKI with boot counting (mkosi.extra/usr/lib/sysupdate.d/).
# - A new UKI counts as good only once boot-complete.target is reached, and the
#   smb-guard kernel check is part of that (omnifile-kernel-check.service).
#   Otherwise systemd-boot falls back to the previous version: a kernel without
#   working fanotify pre-content events never stays booted.
# - The root partition holds /etc and /var: per-box state, which updates don't touch.
#
# Build with appliance/build.sh (it stages our binaries, then runs mkosi).

[Distribution]
Distribution=ubuntu
Release=resolute
Repositories=main,universe
# The product is x86-64. build.sh --arch arm64 builds the same image for arm64, a test build
# whose gate runs at native speed on Apple silicon (HVF); the architecture-specific settings
# are in mkosi.conf.d/. sysupdate.d names the partitions with %a (usr-x86-64, usr-arm64).
Architecture=x86-64
# Reproducible builds: packages come from snapshot.ubuntu.com as the archive was at this time
# (resolute, -updates and -security), not from the live archive. The source offer is
# collected from the same snapshot (appliance/source-offer/, --snapshot). A newer snapshot
# is a deliberate change: bump it, rebuild, and run the gate.
Snapshot=20261023T000000Z

[Output]
ImageId=omnifile-edge
Format=disk
# The usr and usr-verity partitions and the UKI are also written out on their own:
# they are what an update server serves to systemd-sysupdate.
SplitArtifacts=uki,partitions
# omnifile-edge_<version>.manifest: every package in the image with its version, which
# the release's GPL source offer is collected from (appliance/source-offer/).
ManifestFormat=json
# Reproducible builds: systemd-repart derives the disk's and partitions' UUIDs, the
# filesystems' UUIDs and the verity salt from this seed instead of a random one. (The /usr
# and verity partition UUIDs come from the verity root hash, so they still change with the
# content.) build.sh also sets SOURCE_DATE_EPOCH, which clamps every file's mtime.
Seed=a6fd4b8a-7007-4485-aa9d-cbf05ee7f131

[Content]
Bootable=yes
Bootloader=systemd-boot
# mkosi builds the UKI (unsigned until Secure Boot keys exist; README "Next").
UnifiedKernelImages=unsigned
# Named omnifile-edge_<version>.efi, as sysupdate.d/10-uki.transfer expects, so the
# installed version counts as an instance and is never deleted while it runs.
UnifiedKernelImageFormat=%i_%v
# The serial console is per architecture (mkosi.conf.d/): ttyS0 on x86-64, ttyAMA0 on arm64.
KernelCommandLine=rw
# The initrd needs only what finds the boot disk on each hypervisor and mounts /usr:
# without a list, mkosi includes every module (a 420 MB initrd).
KernelInitrdModules=
        default
        /drivers/virtio/
        virtio_blk
        virtio_scsi
        hv_vmbus
        hv_storvsc
        vmw_pvscsi
        nvme
        ahci
        sd_mod
        dm-verity
        erofs
        ext4
        vfat
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
Hostname=omnifile-edge
# SMB and AD identity (decision 28): samba, winbind, krb5. NFS-Ganesha's runtime
# libraries: rpcbind onwards (our Ganesha build ships in /usr/lib/omnifile/ganesha).
# tpm2-tools brings the TSS libraries systemd-creds loads to seal the edge's keys
# to the TPM (M6, "TPM-held keys").
Packages=
        linux-image-generic
        systemd
        systemd-sysv
        systemd-boot
        systemd-container
        systemd-repart
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        ca-certificates
        gpg
        tpm2-tools
        openssh-server
        sudo
        iproute2
        rsyslog
        xfsprogs
        attr
        acl
        e2fsprogs
        samba
        samba-vfs-modules
        winbind
        libnss-winbind
        libpam-winbind
        krb5-user
        smbclient
        # Annexes' NAS mounts (docs/design/annex.md): mount.cifs and cifs.upcall.
        cifs-utils
        rpcbind
        # mount.nfs and rpc.gssd for annexes' NFS mounts, and NFSv3 locking (NLM, on: the owner,
        # 2026-11-04): rpc.statd and sm-notify, which Ganesha's NLM uses to recover locks after a
        # restart (nfs-ganesha-omni.service.d/20-nlm.conf).
        nfs-common
        # The inbound firewall (omnifile-firewall.service, /usr/lib/omnifile/firewall.nft).
        nftables
        libacl1
        libcap2
        libdbus-1-3
        libgssapi-krb5-2
        libjemalloc2
        libkeyutils1
        libnfsidmap1
        liburcu8t64
        libuuid1
# /usr/share/doc stays: with WithDocs=no it holds only each package's copyright file (the
# licence notices the GPL and LGPL ask to go with the binaries) and OmniFile's written source
# offer (build.sh, /usr/share/doc/omnifile).
RemoveFiles=
        /usr/share/man
        /usr/share/info
        /usr/share/locale
# openssh-server's postinst makes host keys at build time, so every box from one image would
# share them (found by comparing two builds). Each box makes its own at first boot instead
# (omnifile-ssh-keygen.service).
        /etc/ssh/ssh_host_*
# Logs and caches of the build itself: they hold build times and inode numbers, nothing a box
# needs (reproducible builds).
        /var/log/alternatives.log
        /var/cache/ldconfig/aux-cache
