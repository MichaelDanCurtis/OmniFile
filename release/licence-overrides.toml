# Licences for packages whose own metadata gives no SPDX licence (release/sbom.py). Each entry names the licence
# and the reason (where it was read). The SBOM marks them "concluded", not "declared". release/licences.py fails a
# shipped component with no licence at all, so a package missing here and from its metadata stops the release.
#
# [pypi]   by distribution name
# [deb]    by Ubuntu SOURCE package and the exact source versions it was read at (`versions`), for sources whose
#          debian/copyright is not machine-readable (DEP-5); read from that file in the release's source offer,
#          snapshot 20261020T000000Z. Another version gets no override, so a new upload is read again.
# [oci]    by image repository: the images' base and build-stage images

[pypi]
isodate = { licence = "BSD-3-Clause", reason = "its LICENSE is BSD 3-clause; METADATA's License field holds only a copyright line" }
markdown-it-py = { licence = "MIT", reason = "LICENSE: MIT; METADATA has only the classifier" }
mdurl = { licence = "MIT", reason = "LICENSE: MIT; METADATA has only the classifier" }
python-dateutil = { licence = "Apache-2.0 AND BSD-3-Clause", reason = "METADATA says 'Dual License'; its LICENSE: code before 2017 is BSD-3-Clause, contributions since are under both Apache-2.0 and BSD-3-Clause, so the package as a whole needs both" }

[deb]
gcc-16 = { licence = "GPL-3.0-or-later WITH GCC-exception-3.1", versions = ["16-20260322-1ubuntu1"], reason = "debian/copyright: the runtime libraries (libgcc-s1, libstdc++6, libatomic1) are GPL-3+ with the GCC Runtime Library Exception" }
krb5 = { licence = "MIT", versions = ["1.22.1-2ubuntu4.1"], reason = "debian/copyright: MIT Kerberos's permissive MIT licence, with BSD-style parts" }
avahi = { licence = "LGPL-2.1-or-later", versions = ["0.8-18ubuntu1.1"], reason = "debian/copyright: the client libraries are LGPL-2.1+" }
libxcrypt = { licence = "LGPL-2.1-or-later", versions = ["1:4.5.1-1"], reason = "debian/copyright: LGPL-2.1+, with some files under BSD and public-domain terms" }
libgcrypt20 = { licence = "LGPL-2.1-or-later", versions = ["1.12.0-2ubuntu1.1"], reason = "debian/copyright: the library is LGPL-2.1+ (its tools GPL-2+)" }
gnutls28 = { licence = "LGPL-2.1-or-later", versions = ["3.8.12-2ubuntu1.1"], reason = "debian/copyright: the library is LGPL-2.1+" }
libksba = { licence = "LGPL-3.0-or-later OR GPL-2.0-or-later", versions = ["1.6.7-2build1"], reason = "debian/copyright: LGPL-3+ or GPL-2+, at the user's choice" }
nfs-utils = { licence = "GPL-2.0-or-later AND BSD-3-Clause", versions = ["1:2.8.5-1ubuntu1"], reason = "debian/copyright: nfs-utils is GPL-2+; libnfsidmap is under a BSD-style licence" }
libnl3 = { licence = "LGPL-2.1-only", versions = ["3.12.0-2"], reason = "debian/copyright: LGPL-2.1" }
pcre2 = { licence = "BSD-3-Clause", versions = ["10.46-1build1"], reason = "debian/copyright: BSD 3-clause (with the PCRE2 exception for its compiled forms)" }
libtasn1-6 = { licence = "LGPL-2.1-or-later", versions = ["4.21.0-2"], reason = "debian/copyright: the library is LGPL-2.1+" }
python3-defaults = { licence = "PSF-2.0", versions = ["3.14.3-0ubuntu2"], reason = "debian/copyright: the Python licence" }
"python3.14" = { licence = "PSF-2.0", versions = ["3.14.4-1ubuntu0.2"], reason = "debian/copyright: the Python Software Foundation licence" }
linux = { licence = "GPL-2.0-only", versions = ["7.0.0-38.38"], reason = "debian/copyright: the Linux kernel, GPL-2" }
linux-signed = { licence = "GPL-2.0-only", versions = ["7.0.0-38.38"], reason = "debian/copyright: the signed Linux kernel image, GPL-2" }
linux-meta = { licence = "GPL-2.0-only", versions = ["7.0.0-38.38"], reason = "debian/copyright: metapackages for the Linux kernel, GPL-2" }

[oci]
python = { licence = "PSF-2.0", reason = "the Docker Official Image of Python: Python's licence, over Debian bookworm's packages under their own" }
node = { licence = "MIT", reason = "the Docker Official Image of Node.js: Node's MIT licence, over Debian bookworm's packages" }
"ghcr.io/astral-sh/uv" = { licence = "MIT OR Apache-2.0", reason = "Astral's uv image: uv's dual licence" }
