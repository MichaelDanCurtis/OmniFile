[project]
name = "omnifile-relay"
version = "0.1.0"
description = "OmniFile Gateway Teams relay: the only public endpoint. Validates Bot Framework Action.Execute clicks and forwards signed intents inward."
requires-python = ">=3.12"
license = "BUSL-1.1"
dependencies = [
    "starlette>=0.47",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10",
    "cryptography>=45",
]

[project.scripts]
omnifile-relay = "omnifile_relay.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifile_relay"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette 1.7 asks for an `httpx2` package for its TestClient; httpx works and is what we ship.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
