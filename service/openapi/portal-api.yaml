              bytes: { type: integer, minimum: 0, description: Current bytes of the live files under the share (its deepest covering share). }
              by_tier:
                type: array
                items:
                  type: object
                  required: [tier, files, bytes]
                  properties:
                    tier: { oneOf: [{ $ref: "#/components/schemas/LogicalTier" }, { type: "null" }], description: null - not uploaded yet. }
                    files: { type: integer, minimum: 0 }
                    bytes: { type: integer, minimum: 0 }
        prices: { type: array, items: { $ref: "#/components/schemas/PriceTableRef" } }
        unpriced: { type: array, items: { type: string }, description: Classes the price tables don't price; an ArchiveAdmin can set them (5.8). }

    LocationCreate:
