            identity_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: "The catalog identity of the user the edge reported making the delete (control-api.md section 4.1 actor). Null when the edge could not tell who (its reconcile pass found the delete, or it sent no actor), or the user is not a catalog identity." }
            proof: { type: string, x-extensible-enum: [proven, claimed, unknown], description: "How sure the service is of who: proven (Kerberos NFS on a Kerberos-only share, or SMB on a proven share), claimed (NFS sec=sys, a local process), or unknown." }

