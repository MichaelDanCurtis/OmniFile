openapi: 3.1.0
info:
  title: OmniFile portal and partner API
  version: 1.0.0-draft
  summary: JSON API of the `web` app, for the portal SPA (sessions) and registered API clients (Entra app tokens).
  description: |
    The prose contract is docs/contracts/portal-api.md; keep the two in step.
    Identifiers are 64-bit integers sent as decimal strings. Times are RFC 3339 UTC.
    Every POST under /v1 needs an Idempotency-Key header, except the three
    preview routes. Session callers send X-CSRF-Token and Origin on unsafe
    methods. Unreadable items are 404, never 403 (decision 28).
    Response fields marked x-extensible-enum are open: they may gain values
    (new backend kinds, layouts, tiers, migration modes). Clients render an
    unknown value as its raw string. Request enums stay closed.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://omnifile-web.internal
    description: The `web` container app. Private network only; no client certificates.
security:
  - session: []
  - partnerToken: []

tags:
  - name: auth
  - name: me
  - name: shares
  - name: browse
  - name: rewind
  - name: recalls
  - name: tiers
  - name: policies
  - name: proposals
  - name: admin
  - name: sources
  - name: partner
  - name: visual
  - name: settings

paths:
  /auth/login:
    get:
      tags: [auth]
      operationId: login
      summary: Start Entra sign-in (auth code + PKCE). Redirects to the authorize endpoint.
      security: []
      parameters:
        - name: return_to
          in: query
          schema: { type: string, maxLength: 2048 }
          description: Same-origin path starting with "/". Anything else becomes "/".
        - name: reauth
          in: query
          schema: { type: integer, enum: [0, 1] }
          description: 1 forces prompt=login (re-authentication for WORM and legal holds).
      responses:
        "302":
          description: To Entra's authorize endpoint. Sets __Host-omnifile_login (SameSite=Lax).
          headers:
            Location: { schema: { type: string } }

  /auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: Entra redirects here. Redeems the code, creates the session, redirects to return_to.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302":
          description: Signed in. Sets __Host-omnifile_session (HttpOnly; Secure; SameSite=Strict).
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: The current session, with the CSRF token. 401 when signed out.
      security:
        - session: []
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session. Returns Entra's end-session URL for the SPA to visit.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Signed out; cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [logout_url]
                properties:
                  logout_url: { type: string, format: uri }
        default: { $ref: "#/components/responses/Problem" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      security:
        - session: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/directory/groups:
    get:
      tags: [me]
      operationId: searchGroups
      summary: AD groups known to the catalog (named by the worker's nightly Graph sync). ArchiveAdmin or share Owners.
      security:
        - session: []
      parameters:
        - name: q
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
          description: Case-insensitive prefix of display name or sAMAccountName, or an exact SID.
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Groups.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/GroupRef" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares:
    get:
      tags: [shares]
      operationId: listShares
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Shares the caller may see (portal-api.md 5.2).
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Share" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [shares]
      operationId: addShare
      summary: A share of a dataset's root, on the dataset's edge, which renders and serves it (portal-api.md 5.16).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewShare" }
      responses:
        "201":
          description: The share, with its checks (the Kerberos throughput note among them).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}:
    get:
      tags: [shares]
      operationId: getShare
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "200":
          description: The share, with its checks and the caller's access.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [shares]
      operationId: removeShare
      summary: The share stops being served; the dataset, its files and their versions stay (portal-api.md 5.16).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                required: [share_id, removed]
                properties:
                  share_id: { $ref: "#/components/schemas/Id" }
                  removed: { type: boolean, const: true }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/settings:
    patch:
      tags: [shares]
      operationId: patchShareSettings
      summary: Open policy, rewind depth and maximum, NFS security. Each field has its own role (portal-api.md 5.6).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareSettingsPatch" }
      responses:
        "200":
          description: Updated share.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/settings/preview:
    post:
      tags: [shares]
      operationId: previewShareSettings
      summary: Checks for proposed settings (Kerberos note, host-trusted). Nothing is saved. No Idempotency-Key.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareSettingsPatch" }
      responses:
        "200":
          description: Checks.
          content:
            application/json:
              schema:
                type: object
                required: [checks]
                properties:
                  checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/access:
    put:
      tags: [shares]
      operationId: putShareAccess
      summary: The share's Owners, Writers and Readers AD groups. Owners group by ArchiveAdmin only.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShareAccess" }
      responses:
        "200":
          description: Updated share.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/worm/enable:
    post:
      tags: [shares]
      operationId: enableWorm
      summary: Turn WORM on (one-way once locked). ArchiveAdmin, re-auth within 10 minutes, typed share name.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WormEnable" }
      responses:
        "200":
          description: WORM is in its validation window; share.worm.lock_deadline says when it locks.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/worm/cancel:
    post:
      tags: [shares]
      operationId: cancelWorm
      summary: Turn WORM off inside the validation window only. ArchiveAdmin, re-auth, typed share name.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm_name]
              properties:
                confirm_name: { type: string, maxLength: 255 }
      responses:
        "200":
          description: WORM off.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/worm/extend:
    post:
      tags: [shares]
      operationId: extendWorm
      summary: Change retention days; once locked, only upwards. ArchiveAdmin.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retention_days]
              properties:
                retention_days: { type: integer, minimum: 1, maximum: 36500 }
      responses:
        "200":
          description: Updated share.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Share" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/dirs/{dir_id}/children:
    get:
      tags: [browse]
      operationId: listChildren
      summary: A folder's readable children, by name (bytewise). With as_of, the folder as it was then.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/DirId"
        - name: as_of
          in: query
          schema: { type: string, format: date-time }
          description: Within the share's rewind depth, else 410 beyond_rewind_depth.
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Children. Live rows are Entry; as_of rows are AsOfEntry.
          content:
            application/json:
              schema:
                type: object
                required: [dir, items, next_cursor]
                properties:
                  dir: { $ref: "#/components/schemas/DirHeader" }
                  as_of: { type: [string, "null"], format: date-time }
                  items:
                    type: array
                    items:
                      oneOf:
                        - $ref: "#/components/schemas/Entry"
                        - $ref: "#/components/schemas/AsOfEntry"
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}:
    get:
      tags: [browse]
      operationId: getFile
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: File or folder detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileDetail" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}/versions:
    get:
      tags: [rewind]
      operationId: listVersions
      summary: Versions inside the rewind depth (or retained by WORM) the caller may see, newest first.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Version" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}/recall-options:
    get:
      tags: [recalls]
      operationId: getRecallOptions
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: version_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
          description: Default the current content version.
      responses:
        "200":
          description: Whether a restore is needed, and each priority's ETA and fee.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallOptions" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}/versions/{version_id}/restore:
    post:
      tags: [rewind]
      operationId: restoreVersion
      summary: Restore an old version as the new current version, or as a copy. Owner or Writer of the share.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VersionRestoreRequest" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionRestore" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}/versions/{version_id}/downloads:
    post:
      tags: [rewind]
      operationId: requestDownload
      summary: Ask for a short-lived download URL for one version (minted by the worker).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/VersionId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadRequest" }
      responses:
        "202":
          description: Preparing, or needs_recall.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/version-restores/{restore_id}:
    get:
      tags: [rewind]
      operationId: getVersionRestore
      security:
        - session: []
      parameters:
        - { name: restore_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The restore.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionRestore" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/downloads/{download_id}:
    get:
      tags: [rewind]
      operationId: getDownload
      security:
        - session: []
      parameters:
        - { name: download_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The download; url is set when state is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/recalls:
    post:
      tags: [recalls]
      operationId: requestRecall
      summary: Recall ahead of time. Starts or joins the one active recall of that content version.
      security:
        - session: []
        - partnerToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallRequest" }
      responses:
        "201":
          description: A new recall.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recall" }
        "200":
          description: Joined an active recall (joined = true).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recall" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [recalls]
      operationId: listRecalls
      security:
        - session: []
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, share, all], default: mine }
        - $ref: "#/components/parameters/ShareIdQuery"
        - name: state
          in: query
          schema: { $ref: "#/components/schemas/RecallState" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Recalls, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recall" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/recalls/{recall_id}:
    get:
      tags: [recalls]
      operationId: getRecall
      summary: The four-step recall view.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/RecallId"
      responses:
        "200":
          description: The recall.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recall" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/pins/preview:
    post:
      tags: [tiers]
      operationId: previewPins
      summary: Warnings and fees for a tier pin, before it is applied. Nothing is saved. No Idempotency-Key.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinPreviewRequest" }
      responses:
        "200":
          description: Per-item checks and totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinPreview" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/pins:
    post:
      tags: [tiers]
      operationId: createPins
      summary: Pin files or folders to a tier (decision 29). Share Owners or DataStewards, with read on every item.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinRequest" }
      responses:
        "201":
          description: Pinned, with any skipped items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinCreateResult" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [tiers]
      operationId: listPins
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareIdQuery"
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pins on readable items.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Pin" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/pins/{pin_id}/release:
    post:
      tags: [tiers]
      operationId: releasePin
      security:
        - session: []
      parameters:
        - { name: pin_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pin" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/holds:
    post:
      tags: [tiers]
      operationId: createHolds
      summary: keep_online (Owners, DataStewards) or legal (ArchiveAdmin, re-auth) holds on files or folders.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HoldRequest" }
      responses:
        "201":
          description: Holds set, with any skipped items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HoldCreateResult" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [tiers]
      operationId: listHolds
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareIdQuery"
        - name: kind
          in: query
          schema: { type: string, enum: [keep_online, legal] }
        - name: file_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
          description: The holds that apply to this file or folder (on it or on a folder above it).
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active holds on readable items.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Hold" } }
