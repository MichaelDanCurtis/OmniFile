      responses:
        "200":
          description: Stored.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PriceDisplay" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/people:
    get:
