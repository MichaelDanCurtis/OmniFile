          enum:
            - invalid_request
            - not_found
            - version_conflict
            - worm_violation
            - request_in_progress
            - policy_not_approved
            - layout_conflict
            - explicit_tier_set
            - beyond_rewind_depth
            - cursor_expired
            - idempotency_key_reused
            - throttled
            - actor_required
            - internal
            - unavailable
            - unauthenticated
            - reauth_required
            - role_required
            - forbidden
            - csrf_failed
            - self_approval
            - proposal_not_pending
            - recall_not_needed
            - version_not_restorable
            - worm_window_closed
            - precondition_failed
            - confirmation_mismatch
            - policy_invalid
            - precondition_required
            - groups_pending
            - name_taken
            - source_conflict
            - migration_conflict
            - config_invalid
            - batch_too_large
            - edge_enrolled
            - dataset_shared
            - share_in_use
            - client_not_registered
            - client_disabled
            - owner_lacks_access
            - dataset_annexed
            - file_present
            - copy_not_refused
            - owner_required
            - mode_not_available
            - rules_check_failed
            - target_not_allowed
            - requester_required
            - placement_not_cancellable
            - placement_not_abandonable
            - dependency_failed
        detail: { type: string }
        retryable: { type: boolean }
        retry_after_s: { type: [integer, "null"] }
        request_id: { type: string }
        errors:
          type: array
          description: invalid_request only.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" }, description: policy_invalid only. }
        max_age_s: { type: integer, description: reauth_required only. }
        rule_checks:
          type: array
          description: rules_check_failed only. The annex.md section 4.2 checks a rule set fails.
          items: { $ref: "#/components/schemas/AnnexRuleCheck" }

    # --- Settings (portal-api.md 5.22) and API clients (5.21)

    SettingCheck:
      type: object
      required: [code, status, title, message]
      properties:
        code: { type: string, description: "What was checked, e.g. private_dns, rbac_role, archive_pair, change_feed, assume_role." }
        status: { type: string, x-extensible-enum: [ok, warning, failed, unknown, not_configured] }
        title: { type: string }
        message: { type: string, description: Plain language, what was found. }
        fix: { type: [string, "null"], description: What to do about it, when not ok. }

    StorageBackend:
      examples:
        - {"backend_id": "1", "name": "azure", "kind": "azure_blob", "private_network": true, "can_be_home": true, "where": "live omnilive01, archive omniarch01, Smart, westeurope", "config": {"layout": "two_account", "primary_account": "omnilive01", "archive_account": "omniarch01", "smart": true, "container": "omnilive01/data", "region": "westeurope"}, "uses": {"datasets": 2, "sources": 0, "migrations": 0}, "created_at": "2026-10-06T09:30:00.000Z"}
      type: object
      required: [backend_id, name, kind, private_network, can_be_home, where, config, uses, created_at]
      properties:
        backend_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
        private_network: { type: boolean }
        can_be_home: { type: boolean }
        where: { type: string, description: "Where its bytes are, in a few words." }
        config:
          type: object
          additionalProperties: true
          description: The row's names (accounts, containers, buckets, region, layout). Never a secret; a row holds none.
        uses:
          type: object
          required: [datasets, sources, migrations]
          properties:
            datasets: { type: integer }
            sources: { type: integer }
            migrations: { type: integer }
        created_at: { type: string, format: date-time }

    StorageSettings:
      type: object
      required: [backends, private_network, aws_configured, dev_mode]
      properties:
        backends: { type: array, items: { $ref: "#/components/schemas/StorageBackend" } }
        private_network: { type: boolean, description: "The deployment reaches storage only through private endpoints (decision 22): a public backend is refused." }
        aws_configured: { type: boolean, description: "The service has AWS settings (OMNIFILE_AWS_ACCOUNTS), so S3 backends can be checked." }
        dev_mode: { type: boolean }

    BackendDraft:
      type: object
      additionalProperties: false
      required: [kind]
      description: "Azure: live and archive (two accounts, non-WORM) or account (one account, WORM shares). S3: account, region and buckets. Endpoints, roles and credentials are deployment settings, never a row's."
      properties:
        kind: { type: string, enum: [azure, s3] }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        live: { type: string, pattern: "^[a-z0-9]{3,24}$" }
        archive: { type: string, pattern: "^[a-z0-9]{3,24}$" }
        account: { type: string, maxLength: 24, description: "Azure: the one storage account. S3: the 12-digit account id." }
        worm: { type: boolean, default: false }
        smart: { type: boolean }
        container: { type: string, default: data }
        region: { type: string, maxLength: 40 }
        buckets: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 63 } }
        versioning: { type: boolean, default: true }
        archive_class: { type: string, enum: [GLACIER, DEEP_ARCHIVE] }

    BackendChange:
      type: object
      required: [outcome, backend, changes]
      properties:
        outcome: { type: string, enum: [added, updated, unchanged] }
        backend: { $ref: "#/components/schemas/StorageBackend" }
        changes: { type: array, items: { type: string } }

    BackendChecks:
      type: object
      required: [backend_id, checked_at, checks]
      properties:
        backend_id: { $ref: "#/components/schemas/Id" }
        checked_at: { type: string, format: date-time }
        checks: { type: array, items: { $ref: "#/components/schemas/SettingCheck" } }

    AwsSettings:
      type: object
      required: [configured, private_network, audience, tenant_id, issuer, subjects, accounts]
      properties:
        configured: { type: boolean }
        private_network: { type: boolean }
        audience: { type: [string, "null"], description: "The web-identity audience: the deployment's api:// application ID URI." }
        tenant_id: { type: string }
