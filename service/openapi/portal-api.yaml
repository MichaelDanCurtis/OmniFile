  /v1/annexes/{annex_id}/return-preview:
    post:
      tags: [annex]
      operationId: previewAnnexReturns
      summary: >-
        The return rules (`recall_completed`) over the annex's removed files: per rule
        the files it takes (and may take, when it names requesters), per target the
        names taken today and the bytes needed against free space. Computed by the
        service. ArchiveAdmins and apps only.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnexDryRunCreate" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexReturnPreview" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/files/{file_id}/return-targets:
    get:
      tags: [annex]
      operationId: getReturnTargets
      summary: >-
        Where the annex's return rules let the requester have this annexed file
        placed, default first, each with the requester's write check, today's name
        conflict and free space. An API client names the person (`requester`).
      parameters:
        - $ref: "#/components/parameters/FileId"
        - name: requester
          in: query
          required: false
          description: API clients only, the person the file is for.
          schema: { $ref: "#/components/schemas/Sid" }
      responses:
        "200":
          description: The targets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnTargets" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/placements:
    post:
      tags: [annex]
      operationId: requestPlacement
      summary: >-
        Have an annexed file placed back on the NAS or in a share, at one of its
        return targets. Brings the bytes back from Archive first (`priority`). A
        second request for the same file and target joins the open one.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacementCreate" }
      responses:
        "200":
          description: Joined an open placement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexPlacement" }
        "201":
          description: Requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexPlacement" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/placements/{placement_id}:
    get:
      tags: [annex]
      operationId: getPlacement
      summary: A placement's progress and where the file landed.
      parameters:
        - name: placement_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The placement.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexPlacement" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/placements/{placement_id}/cancel:
    post:
      tags: [annex]
      operationId: cancelPlacement
      summary: >-
        The way out of a placement that can't go on: its requester's or an ArchiveAdmin's.
        One that has its `go` can't be cancelled (`409 placement_not_cancellable`), because
        the file may already be under its name. Audited.
      security:
        - session: []
      parameters:
        - name: placement_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The placement, cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexPlacement" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/placements/{placement_id}/abandon:
    post:
      tags: [annex]
      operationId: abandonPlacement
      summary: >-
        The way out of a placement stuck after its go, when the edge has said nothing new
        for a day (`409 placement_not_abandonable` otherwise). An ArchiveAdmin's, audited. It
        ends as `failed: abandoned`, whatever the edge reports later is refused and audited,
        and the next scan finds the file on the NAS, so the worst case is a recopy.
      security:
        - session: []
      parameters:
        - name: placement_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The placement, ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexPlacement" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/removals/confirm:
    post:
      tags: [annex]
      operationId: confirmAnnexRemovals
      summary: >-
        End the dry run: an ArchiveAdmin who reviewed it confirms, with a sign-in
        in the last 10 minutes, for the running rule set version (decision 59).
        Never the person who proposed the rules, nor anyone answerable for its app.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Confirmed; removals are live unless something pauses them.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annex" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/removals:
    get:
      tags: [annex]
      operationId: listAnnexRemovals
      summary: The annex's removals and their steps, newest first, filtered by the files' ACLs.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - name: state
          in: query
          schema: { type: string, enum: [pending, done, cancelled, stuck] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Removals.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, live]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AnnexRemoval" } }
                  next_cursor: { type: [string, "null"] }
                  live: { type: boolean }
                  why_not:
                    type: [string, "null"]
                    x-extensible-enum: [annex_not_active, no_removing_rules, paused, dry_run,
                                        not_confirmed]
                  would_remove:
                    description: >-
                      What the dry run says the running rules would remove: files, bytes,
                      and up to 20 sample paths. ArchiveAdmins and apps only (null for
                      anyone else: counts of an unfiltered listing).
                    oneOf:
                      - type: object
                        required: [files, bytes, samples]
                        properties:
                          files: { type: integer }
                          bytes: { type: integer, format: int64 }
                          samples: { type: array, items: { type: string } }
                      - type: "null"
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/events:
    get:
      tags: [annex]
      operationId: listAnnexEvents
      summary: The annex's timeline of events, newest first.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - name: kind
          in: query
          description: Event kinds, comma-separated.
          schema: { type: string }
        - name: since
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AnnexEvent" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files:
    get:
      tags: [annex]
      operationId: listAnnexFiles
      summary: The annex's copied files by path, as the NAS's ACLs let the caller read them.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - name: path
          in: query
          description: A path prefix under the annex's root.
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, enum: [present, gone, purged] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Files.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AnnexFile" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/timeline:
    get:
      tags: [annex]
      operationId: getAnnexTimeline
      summary: Arrivals, departures, changes, copies and verifications per UTC day.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
      responses:
        "200":
          description: One row per day, oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexTimeline" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/problems:
    get:
      tags: [annex]
      operationId: getAnnexProblems
      summary: Reconciliation drift and the copier's problems.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
      responses:
        "200":
          description: Problems, newest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexProblems" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files/{file_id}/purge:
    post:
      tags: [annex]
      operationId: purgeAnnexFile
      summary: >-
        Purge the kept copy of a file deleted on the NAS. ArchiveAdmin, with a sign-in
        in the last 10 minutes (`401 reauth_required` otherwise).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "202":
          description: Requested; the worker purges it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexFile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files/{file_id}/clear-breaker:
    post:
      tags: [annex]
      operationId: clearAnnexFileBreaker
      summary: >-
        An Owner looked at a file the loop breaker pinned: it may leave the NAS again, and
        the breaker counts returns from now. An ArchiveAdmin or the annex's Owners. Audited.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexFile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files/{file_id}/copy-stop:
    post:
      tags: [annex]
      operationId: stopAnnexFileCopy
      summary: >-
        A copy Azure's read-back keeps refusing: its edge doesn't copy the same bytes
        again, its own reconciliation included, until a version verifies or an
        ArchiveAdmin resumes it (`copy-resume`). A changed file is still copied. Only a
        file whose copy was refused (`409 copy_not_refused`). ArchiveAdmin, with a
        sign-in in the last 10 minutes. Audited as `annex.copy.stopped`.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexFile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files/{file_id}/copy-resume:
    post:
      tags: [annex]
      operationId: resumeAnnexFileCopy
      summary: >-
        Its edge may copy the file again. ArchiveAdmin, with a sign-in in the last 10
        minutes. Audited as `annex.copy.resumed`, with `was_stopped`.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexFile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/files/{file_id}/copy-refused-ack:
    post:
      tags: [annex]
      operationId: acknowledgeAnnexFileCopyRefused
      summary: >-
        An ArchiveAdmin has seen the refusals: the file leaves the gauge
        `omnifile.annex.copies_refused`, so the alert `annex-copies-refused` quiets for
        it alone, until a version verifies, or until its copy is refused again while
        copying isn't stopped. It stays on Problems. With a sign-in in the last 10
        minutes. Audited as `annex.copy.refused_ack`.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/AnnexId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: The file.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexFile" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/annex-defaults:
    get:
      tags: [annex]
      operationId: getAnnexDefaults
      summary: The quiet period and scan schedules new annexes start with.
      security:
        - session: []
      responses:
        "200":
          description: Defaults.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexDefaults" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [annex]
      operationId: putAnnexDefaults
      summary: Change the defaults. ArchiveAdmin.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnexSettingsPut" }
      responses:
        "200":
          description: Stored.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexDefaults" }
        default: { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-omnifile_session
      description: |
        Server-side session (backend-for-frontend). Unsafe methods also need
        X-CSRF-Token (from GET /auth/session) and a same-origin Origin header.
    partnerToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Entra v2 access token for our API, idtyp=app, roles from
        Policy.Propose | Recall.Request | Archive.Read | Archive.Adopt.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for session callers; ignored for bearer callers.
      schema: { type: string, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The resource's ETag (quoted entity_version).
      schema: { type: string, maxLength: 32 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
    ShareId:
      name: share_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ShareIdQuery:
      name: share_id
      in: query
      schema: { $ref: "#/components/schemas/Id" }
    DirId:
      name: dir_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    VersionId:
      name: version_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RecallId:
      name: recall_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    FilerId:
      name: filer_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    RulesetVersion:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    DryRunId:
      name: run_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    AnnexId:
      name: annex_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    DatasetId:
      name: dataset_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ProposalId:
      name: proposal_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    SourceId:
      name: source_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    MigrationId:
      name: migration_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    PlanId:
      name: plan_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    WaveSeq:
      name: seq
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 500 }
    BackendKind:
      name: backend_kind
      in: path
      required: true
      description: Closed for requests today; new backend kinds are added here additively.
      schema: { type: string, enum: [azure_blob, s3, sim] }

  responses:
    Problem:
      description: RFC 9457 problem details.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    FilerCreate:
      type: object
      additionalProperties: false
      required: [name, host, protocol, export, edge_id]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        vendor: { type: string, enum: [generic, ontap, powerscale] }
        host: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9.:-]{0,252}$" }
        protocol: { type: string, enum: [smb, nfs3, nfs4] }
        export: { type: string, minLength: 1, maxLength: 1024, description: "SMB share name, or NFS export path." }
        edge_id: { $ref: "#/components/schemas/Id" }
        credential_mode: { type: string, enum: [machine_account, service_keytab, sec_sys] }
        event_source: { type: string, enum: [scan, smb_notify] }
    Filer:
      type: object
      required: [filer_id, name, vendor, host, protocol, export, edge_id, credential_mode,
                 host_trusted, event_source, health, health_checked_at, created_at]
      properties:
        filer_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        vendor: { type: string, x-extensible-enum: [generic, ontap, powerscale] }
        host: { type: string }
        protocol: { type: string, x-extensible-enum: [smb, nfs3, nfs4] }
        export: { type: string }
        edge_id: { $ref: "#/components/schemas/Id" }
        credential_mode:
          type: string
          x-extensible-enum: [machine_account, service_keytab, sec_sys]
        host_trusted: { type: boolean, description: "sec=sys: the NAS trusts the edge's address." }
        event_source: { type: string, x-extensible-enum: [scan, smb_notify] }
        health: { type: [object, "null"], additionalProperties: true }
        health_checked_at: { type: [string, "null"], format: date-time }
        placement_sid:
          type: [string, "null"]
          description: >-
            The account that writes placed files on this NAS. Every SMB filer needs it: the
            staged file's owner is whoever placed it, and at `go` only this account's entries
            count as the file's own owner's. Registered with `PATCH /v1/filers/{filer_id}`.
        placement_account_report:
          type: [object, "null"]
          description: >-
            What a person sees before registering it: what this filer's own edge reports from
            winbind about the account it places files with. For an ArchiveAdmin, who alone can
            act on it; null for anyone else, and on a filer that isn't SMB.
            `can_register` says whether the route would take `sid`, and `why_not` says why not
            (`no_report`, `stale_report`, `not_an_account`). It registers nothing by itself.
          required: [sid, kind, name, error, reported_at, can_register, why_not]
          properties:
            sid: { type: [string, "null"] }
            kind: { type: [string, "null"], description: "user, computer, group, ..." }
            name: { type: [string, "null"], description: The principal the edge holds. }
            error: { type: [string, "null"], description: Why the edge can't name its account. }
            reported_at: { type: [string, "null"], format: date-time }
            can_register: { type: boolean }
            why_not: { type: [string, "null"] }
        access:
          type: object
          description: >-
            Decision 65: whether the share or export limits access beyond the files'
            permissions, as an ArchiveAdmin answered (`PATCH /v1/filers/{filer_id}`), with
            who and when. Unanswered (`answered` false): its annexes' files are hidden.
          required: [answered, limited, groups, confirmed_by, confirmed_at]
          properties:
            answered: { type: boolean }
            limited: { type: [boolean, "null"] }
            groups: { type: array, items: { type: string } }
            confirmed_by: { type: [string, "null"] }
            confirmed_at: { type: [string, "null"], format: date-time }
        acls:
          type: object
          description: >-
            Decision 64: since when the filer's NAS has shown no ACLs through its mount (the
            edge checks at every mount), and who acknowledged it. `blocks_grants`: flagged
            and not acknowledged, so group-readable placements and share copies of its
            files are refused.
          required: [hidden_since, acknowledged_by, acknowledged_at, blocks_grants]
          properties:
            hidden_since: { type: [string, "null"], format: date-time }
            acknowledged_by: { type: [string, "null"] }
            acknowledged_at: { type: [string, "null"], format: date-time }
            blocks_grants: { type: boolean }
        created_at: { type: string, format: date-time }
    FilerHealth:
      type: object
      required: [filer_id, checked_at, ok, annexes]
      properties:
        filer_id: { $ref: "#/components/schemas/Id" }
        checked_at: { type: [string, "null"], format: date-time }
        ok: { type: [boolean, "null"] }
        read_only: { type: [boolean, "null"] }
        readable: { type: [boolean, "null"] }
        sec: { type: [string, "null"] }
        error: { type: [string, "null"] }
        annexes: { type: integer }
    AnnexSettings:
      type: object
      additionalProperties: false
      properties:
        quiet_minutes: { type: integer, minimum: 1, maximum: 1440 }
        quick_scan_minutes: { type: integer, minimum: 1, maximum: 10080 }
        full_scan_minutes: { type: integer, minimum: 5, maximum: 43200 }
        reconcile_days: { type: integer, minimum: 1, maximum: 90 }
    AnnexDefaults:
      type: object
      required: [quiet_minutes, quick_scan_minutes, full_scan_minutes, reconcile_days]
      properties:
        quiet_minutes: { type: integer }
        quick_scan_minutes: { type: integer }
        full_scan_minutes: { type: integer }
        reconcile_days: { type: integer }
        removals_paused:
          type: boolean
          description: Settings only. "Pause all removals" for every annex.
        placements_paused:
          type: boolean
          description: Settings only. "Pause all placements" for every annex.
        removal_rate_per_hour: { type: integer, description: Settings only. }
        grace_minutes: { type: integer, description: Settings only. }
        dry_run_days: { type: integer, description: "Settings only. A removing rule set's dry run." }
        updated_at: { type: string, format: date-time }
        updated_by: { type: [string, "null"] }
    AnnexCreate:
      type: object
      additionalProperties: false
      required: [name, filer_id, dataset_id, owners_sid]
      properties:
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$" }
        filer_id: { $ref: "#/components/schemas/Id" }
        path: { type: string, maxLength: 1024, description: "Under the filer's export; '' = all of it." }
        mode:
          type: string
          description: >-
            Copy runs at once. A removing mode copies at once under the Copy
            template and proposes its own rule set, which an ArchiveAdmin
            approves (and which starts in dry run). Custom takes `rules`.
          enum: [copy, archive_after, move_now, custom]
        archive_after_days: { type: integer, minimum: 1, maximum: 36500, description: "mode archive_after only." }
        rules: { $ref: "#/components/schemas/AnnexRuleBody" }
        rationale: { type: string, maxLength: 2000 }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_path: { type: string, maxLength: 1024 }
        owners_sid: { $ref: "#/components/schemas/Sid" }
        owner:
          $ref: "#/components/schemas/Sid"
          description: Apps only. The person who owns the annex, in its Owners group.
        settings: { $ref: "#/components/schemas/AnnexSettings" }
    AnnexPatch:
      type: object
      additionalProperties: false
      properties:
        state: { type: string, enum: [active, paused, retired] }
        settings: { $ref: "#/components/schemas/AnnexSettings" }
        deleted_retention_days: { type: [integer, "null"], minimum: 1, maximum: 36500 }
        removals_paused:
          type: boolean
          description: Owners may pause; resuming is an ArchiveAdmin's, with a recent sign-in.
        placements_paused:
          type: boolean
          description: >-
            The placements' kill switch: an ArchiveAdmin's, either way, audited. Nothing is
            placed by this annex or on its filer while it is on.
        pointer_files: { type: boolean }
        grace_minutes: { type: integer, minimum: 1, maximum: 1440, description: ArchiveAdmin. }
        removal_rate_per_hour: { type: integer, minimum: 1, maximum: 100000, description: ArchiveAdmin. }
        removal_window:
          description: ArchiveAdmin. Removals only between these times (or null, any time).
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [start, end]
              properties:
                start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
                tz: { type: string }
    AnnexSettingsPut:
      type: object
      additionalProperties: false
      properties:
        quiet_minutes: { type: integer, minimum: 1, maximum: 1440 }
        quick_scan_minutes: { type: integer, minimum: 1, maximum: 10080 }
        full_scan_minutes: { type: integer, minimum: 5, maximum: 43200 }
        reconcile_days: { type: integer, minimum: 1, maximum: 90 }
        removals_paused: { type: boolean, description: "Resuming needs a recent sign-in." }
        placements_paused: { type: boolean, description: Nothing is placed while it is on. }
        removal_rate_per_hour: { type: integer, minimum: 1, maximum: 100000 }
        grace_minutes: { type: integer, minimum: 1, maximum: 1440 }
        dry_run_days: { type: integer, minimum: 1, maximum: 90 }
    AnnexRemoval:
      type: object
      required: [removal_id, file_id, version_id, path, state]
      properties:
        removal_id: { $ref: "#/components/schemas/Id" }
        file_id: { $ref: "#/components/schemas/Id" }
        version_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        size: { type: [integer, "null"] }
        rule: { type: string }
        ruleset_version: { type: integer }
        state:
          type: string
          x-extensible-enum: [ticketed, hidden, deleting, deleted, done, cancelled, stuck]
        issued_at: { type: string, format: date-time }
        hidden_at: { type: [string, "null"], format: date-time }
        deleted_at: { type: [string, "null"], format: date-time }
        done_at: { type: [string, "null"], format: date-time }
        pointer_written: { type: [boolean, "null"] }
        cancel_reason: { type: [string, "null"] }
    AnnexRuleBody:
      type: object
      description: >-
        A rule set (annex.md section 4.1): `rules`, each `{id?, label?, trigger,
        conditions, actions}`. Triggers: arrived, changed, age, deleted_at_source.
        Conditions: path, extension, size_gte, size_lt, age_since_arrival_days_gt,
        modified_age_days_gt, accessed_age_days_gt, owner_sids, group_sids,
        content_type. Actions (one key each): exclude, copy_to, remove_from_source,
        remove_after_days, policy, tag, keep_copy. Every list is open.
      required: [rules]
      additionalProperties: true
      properties:
        rules:
          type: array
          items:
            type: object
            required: [trigger]
            additionalProperties: true
            properties:
              id: { type: string }
              label: { type: string }
              trigger:
                type: string
                x-extensible-enum: [arrived, changed, age, deleted_at_source, recall_completed]
              conditions: { type: object, additionalProperties: true }
              actions: { type: array, items: { type: object, additionalProperties: true } }
    AnnexRuleCheck:
      type: object
      required: [rule, check, message]
      properties:
        rule: { type: string }
        check:
          type: string
          x-extensible-enum: [missing_default, unreachable, remove_without_copy, remove_without_age,
                              remove_before_quiet, return_into_drop_folder, return_without_hold,
                              overwrite_outside_annex, unknown_location, location_unreachable]
        message: { type: string }
    AnnexRuleset:
      type: object
      required: [version, state, mode, removes, needs_archive_admin, owner_identity_id,
                 proposed_via, created_at]
      properties:
        version: { type: integer }
        state:
          type: string
          x-extensible-enum: [proposed, approved, active, superseded, rejected, withdrawn]
        mode: { type: string, x-extensible-enum: [copy, archive_after, move_now, custom] }
        removes: { type: boolean }
        needs_archive_admin:
          type: boolean
          description: Adds or widens a removal, so only an ArchiveAdmin approves it.
        replaces_on_nas:
          type: array
          items: { type: string }
          description: >-
            A3.4 (decision 85): the return rules that may replace a file on the NAS (a NAS
            target in this annex with overwrite_keep_version). The approval page marks them
            "replaces files on the NAS". Only the file's own name in its original folder is
            ever replaced (decision 82).
        owner_identity_id: { $ref: "#/components/schemas/Id" }
        owner_name: { type: [string, "null"] }
        proposed_via: { type: string, x-extensible-enum: [portal, api] }
        proposed_by_app: { type: [string, "null"] }
        rationale: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        decided_by_identity_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        decision_note: { type: [string, "null"] }
        dry_run_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        body: { $ref: "#/components/schemas/AnnexRuleBody" }
    AnnexRulesetDetail:
      allOf:
        - $ref: "#/components/schemas/AnnexRuleset"
        - type: object
          required: [body, checks]
          properties:
            checks: { type: array, items: { $ref: "#/components/schemas/AnnexRuleCheck" } }
            dry_run:
              oneOf: [{ $ref: "#/components/schemas/AnnexDryRun" }, { type: "null" }]
            running_version: { type: [integer, "null"] }
            running_body:
              description: The running rule set's body, to compare a proposal with (null for itself).
              oneOf: [{ $ref: "#/components/schemas/AnnexRuleBody" }, { type: "null" }]
    AnnexRulesetPropose:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { $ref: "#/components/schemas/AnnexRuleBody" }
        rationale: { type: string, maxLength: 2000 }
        owner:
          $ref: "#/components/schemas/Sid"
          description: Apps only. The person who owns the proposal, in the Owners group.
    AnnexDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 2000 }
    ReturnLocation:
      type: object
      description: >-
        A return location (annex.md section 4.1): `{kind: nas_folder, origin: true}`,
        `{kind: nas_folder, path}` (this annex's folder), `{kind: nas_folder, annex_id,
        path}`, `{kind: nas_folder, filer_id, path}` (relative to the filer's export),
        or `{kind: share_folder, share_id, path}`; `keep_relative_path` (default
        true) keeps the file's folders below the annex.
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, x-extensible-enum: [nas_folder, share_folder] }
        origin: { type: boolean }
        annex_id: { $ref: "#/components/schemas/Id" }
        filer_id: { $ref: "#/components/schemas/Id" }
        share_id: { $ref: "#/components/schemas/Id" }
        path: { type: string, maxLength: 1024 }
        keep_relative_path: { type: boolean }
    PlacementTarget:
      type: object
      description: >-
        A resolved target: `nas` (a folder of a filer, relative to its export) or
        `share` (a folder of a share), and the file's name there.
      required: [kind, folder, name]
      properties:
        kind: { type: string, x-extensible-enum: [nas, share] }
        folder: { type: string }
        name: { type: string }
        filer_id: { $ref: "#/components/schemas/Id" }
        share_id: { $ref: "#/components/schemas/Id" }
        origin: { type: boolean }
        display: { type: string, description: "Where it lands, as a person types it." }
    ReturnTargets:
      type: object
      required: [file_id, annex_id, nas_state, rule, ruleset_version, items]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        annex_id: { $ref: "#/components/schemas/Id" }
        nas_state: { type: string, x-extensible-enum: [present, gone, removing, removed, returned] }
        rule: { type: [string, "null"], description: "The return rule that decided; null: none." }
        ruleset_version: { type: [integer, "null"] }
        items:
          type: array
          items:
            type: object
            required: [location, default, on_conflict, hold_days, allowed]
            properties:
              location: { $ref: "#/components/schemas/ReturnLocation" }
              default: { type: boolean }
              on_conflict:
                type: string
                x-extensible-enum: [same_content, restored_name, overwrite_keep_version]
              hold_days: { type: integer }
              allowed: { type: boolean, description: "The requester may have it placed there." }
              why_not: { type: [string, "null"] }
              target:
                oneOf: [{ $ref: "#/components/schemas/PlacementTarget" }, { type: "null" }]
              display: { type: [string, "null"] }
              name_taken: { type: [boolean, "null"], description: "As far as the catalog knows; null: it can't tell." }
              replace_older:
                type: boolean
                description: >-
                  A3.4 (decision 83): the file is still on the NAS there, and an older version of
                  it may replace it (POST /v1/placements with that version_id).
              free_bytes: { type: [integer, "null"], description: "As the edge last saw it, for a NAS target." }
              space_seen_at: { type: [string, "null"], format: date-time }
    PlacementCreate:
      type: object
      additionalProperties: false
      required: [file_id, place_at]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        version_id: { $ref: "#/components/schemas/Id" }
        place_at:
          description: "`default`, or one of the file's return targets' locations (or a folder below one)."
          oneOf: [{ type: string, enum: [default] }, { $ref: "#/components/schemas/ReturnLocation" }]
        on_conflict:
          type: string
          description: Never harsher than the rule's.
          x-extensible-enum: [same_content, restored_name, overwrite_keep_version]
        priority: { type: string, description: "When the bytes are in Archive: one of the file's recall options." }
        note: { type: string, maxLength: 500, description: "Why do you need it?" }
        requester: { $ref: "#/components/schemas/Sid" }
    AnnexPlacement:
      type: object
      required: [placement_id, annex_id, file_id, version_id, requester_identity_id,
                 request_via, rule, target, on_conflict, hold_days, state, requested_at]
      properties:
        placement_id: { $ref: "#/components/schemas/Id" }
        annex_id: { $ref: "#/components/schemas/Id" }
        file_id: { $ref: "#/components/schemas/Id" }
        version_id: { $ref: "#/components/schemas/Id" }
        recall_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        requester_identity_id: { $ref: "#/components/schemas/Id" }
        request_via: { type: string, x-extensible-enum: [portal, teams, api] }
        note: { type: [string, "null"] }
        rule: { type: string }
        ruleset_version: { type: [integer, "null"] }
        target: { $ref: "#/components/schemas/PlacementTarget" }
        display: { type: [string, "null"] }
        chosen:
          oneOf: [{ $ref: "#/components/schemas/ReturnLocation" }, { type: "null" }]
        on_conflict:
          type: string
          x-extensible-enum: [same_content, restored_name, overwrite_keep_version]
        hold_days: { type: integer }
        state:
          type: string
          x-extensible-enum: [requested, rehydrating, ready, writing, verifying, securing,
                              placing, stuck, placed, failed, cancelled]
        outcome:
          type: [string, "null"]
          description: >-
            placed, restored_name, already_there, replaced (the file there was replaced; it
            stays a version), replaced_old_kept (the file there was kept under a -replaced-
            name), overwrite_refused_<why> (an overwrite that didn't happen; a -restored
            name instead), or replace_unconfirmed (the edge said replaced without saying the
            old file went: nothing is claimed, and the next scan finds what is there).
        fail_reason: { type: [string, "null"] }
        fail_detail: { type: [string, "null"] }
        final_path: { type: [string, "null"] }
        replace:
          description: >-
            A3.4: a replace at the origin, and what became of the file that was there. Null when
            none was looked at.
          oneOf:
            - type: "null"
            - type: object
              required: [state, refused, replaced_version_id, hidden_name, kept_as]
              properties:
                state:
                  type: string
                  x-extensible-enum: [offered, same, hidden, put_back, replaced, kept_aside, gone,
                                      refused]
                refused: { type: [string, "null"], description: Why it didn't (or wasn't offered). }
                replaced_version_id:
                  oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }]
                  description: The version the replaced file was; it stays in the file's history.
                hidden_name: { type: [string, "null"] }
                kept_as: { type: [string, "null"], description: The old file's -replaced- name. }
        requested_at: { type: string, format: date-time }
        updated_at: { type: [string, "null"], format: date-time }
        done_at: { type: [string, "null"], format: date-time }
        joined: { type: boolean }
    AnnexReturnPreview:
      type: object
      required: [files, truncated, rules, placed_nowhere, checks]
      properties:
        files: { type: integer, description: "Removed files looked at." }
        truncated: { type: boolean, description: "It stopped at 200,000 files." }
        placed_nowhere:
          type: object
          properties:
            files: { type: integer }
            bytes: { type: integer }
        rules:
          type: array
          items:
            type: object
            required: [id, files, bytes, may_take, targets]
            properties:
              id: { type: string }
              files: { type: integer }
              bytes: { type: integer }
              may_take: { type: integer, description: "Files it takes for a requester it names." }
              targets:
                type: array
                items:
                  type: object
                  required: [location, files, bytes, names_taken]
                  properties:
                    location: { $ref: "#/components/schemas/ReturnLocation" }
                    files: { type: integer }
                    bytes: { type: integer }
                    names_taken: { type: integer }
                    free_bytes: { type: [integer, "null"] }
        checks: { type: array, items: { $ref: "#/components/schemas/AnnexRuleCheck" } }
    AnnexDryRunCreate:
      type: object
      additionalProperties: false
      properties:
        body:
          description: A draft rule set; omitted or null previews the running one.
          oneOf: [{ $ref: "#/components/schemas/AnnexRuleBody" }, { type: "null" }]
    AnnexDryRun:
      type: object
      required: [run_id, annex_id, state, requested_at]
      properties:
        run_id: { $ref: "#/components/schemas/Id" }
        annex_id: { $ref: "#/components/schemas/Id" }
        ruleset_version: { type: [integer, "null"] }
        state: { type: string, x-extensible-enum: [requested, running, done, failed] }
        requested_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        report_hidden:
          type: boolean
          description: >-
            The run has a report the caller may not see: counts over the NAS listing are
            an ArchiveAdmin's until an annex's folders carry the NAS's ACLs.
        checks: { type: array, items: { $ref: "#/components/schemas/AnnexRuleCheck" } }
        report:
          description: >-
            The edge's preview: files and bytes per rule (with up to 20 sample
            paths for ArchiveAdmins and apps), what would be copied, excluded or
            left undecided, and when files would leave the NAS (now, per day, and
            how many can't be decided now). ArchiveAdmins and apps only, for now.
          oneOf: [{ type: object, additionalProperties: true }, { type: "null" }]
    Annex:
      type: object
      required: [annex_id, name, mode, state, filer_id, filer_name, unc, path, dataset_id,
                 dataset_name, dataset_path, edge_id, owners_sid, settings, ruleset_version,
                 host_trusted, baseline, entity_version]
      properties:
        annex_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        mode: { type: string, x-extensible-enum: [copy, archive_after, move_now, custom] }
        state:
          type: string
          x-extensible-enum: [registered, baseline, active, paused, retired]
        filer_id: { $ref: "#/components/schemas/Id" }
        filer_name: { type: string }
        unc: { type: string, description: "Where it is, as people write it." }
        path: { type: string }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_name: { type: string }
        dataset_path: { type: string }
        edge_id: { $ref: "#/components/schemas/Id" }
        owners_sid: { $ref: "#/components/schemas/Sid" }
        settings: { $ref: "#/components/schemas/AnnexDefaults" }
        deleted_retention_days: { type: [integer, "null"] }
        ruleset_version: { type: [integer, "null"] }
        ruleset_state:
          type: [string, "null"]
          description: >-
            The newest rule set's state. An app's annex is `proposed` until one
            of its Owners or an ArchiveAdmin approves it; the edge starts it then.
          x-extensible-enum: [proposed, approved, active, superseded, rejected, withdrawn]
        host_trusted: { type: boolean }
        pending_proposals: { type: integer }
        removals:
          type: object
          description: >-
            What the removal pipeline (phase A2.2) will obey. `enabled` is false
            until it is built: nothing is removed from any NAS before then.
          properties:
            paused: { type: boolean }
            dry_run_until: { type: [string, "null"], format: date-time }
            rate_per_hour: { type: integer }
            window: { type: [object, "null"], additionalProperties: true }
            grace_minutes: { type: integer }
            pointer_files: { type: boolean }
            enabled: { type: boolean }
            confirmed_version: { type: [integer, "null"] }
            confirmed_at: { type: [string, "null"], format: date-time }
        baseline:
          type: object
          required: [at, files, bytes]
          properties:
            at: { type: [string, "null"], format: date-time }
            files: { type: [integer, "null"] }
            bytes: { type: [integer, "null"] }
        last_quick_scan_at: { type: [string, "null"], format: date-time }
        last_full_scan_at: { type: [string, "null"], format: date-time }
        last_reconcile_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        entity_version: { type: integer }
    AnnexDetail:
      allOf:
        - $ref: "#/components/schemas/Annex"
        - type: object
          required: [counts, filer, can_manage, can_purge]
          properties:
            counts:
              type: object
              required: [present, copied, verified, pending, gone, purged, bytes, bytes_verified,
                         problems_30d]
              properties:
                present: { type: integer }
                copied: { type: integer }
                verified: { type: integer }
                pending: { type: integer }
                gone: { type: integer }
                purged: { type: integer }
                bytes: { type: integer }
                bytes_verified: { type: integer }
                problems_30d: { type: integer }
            filer: { $ref: "#/components/schemas/Filer" }
            can_manage: { type: boolean }
            can_purge: { type: boolean }
    AnnexEvent:
      type: object
      required: [event_id, at, kind, path, file_id, details]
      properties:
        event_id: { $ref: "#/components/schemas/Id" }
        at: { type: string, format: date-time }
        kind:
          type: string
          x-extensible-enum: [created, settings, mount, scan, baseline, arrived, changed, left,
                              renamed, copied, verified, drift, skipped, copy_failed, problem,
                              purged, purge_refused]
        path: { type: [string, "null"] }
        file_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        version_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        size: { type: [integer, "null"] }
        observed_at: { type: [string, "null"], format: date-time }
        resolved:
          type: boolean
          description: >-
            On the problems list only: a `copy_refused` problem whose file has since had a
            later version read back and verified. Absent otherwise.
        details:
          type: [object, "null"]
          additionalProperties: true
          description: >-
            For an event without a catalog file (skipped, drift), only `reason`
            or `drift` unless the caller is an ArchiveAdmin or an app; its
            `path` is then null too.
    AnnexFile:
      type: object
      required: [file_id, path, size, nas_state, copy_state, first_seen, last_seen, gone_since]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        size: { type: integer }
        mtime_ns: { oneOf: [{ $ref: "#/components/schemas/Nanos" }, { type: "null" }] }
        folders_narrow:
          description: >-
            Decision 63: the folders above the file on the NAS, relative to the export
            ("" is its root), that don't let everyone through or haven't been read. Who
            may read the file is who its own ACL lets read and these let through.
          type: array
          items: { type: string }
        nas_state:
          type: string
          x-extensible-enum: [present, gone, removing, removed, returned]
        copy_state: { type: string, x-extensible-enum: [pending, copied, verified, changed, purged] }
        tier:
          oneOf: [{ $ref: "#/components/schemas/LogicalTier" }, { type: "null" }]
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        gone_since: { type: [string, "null"], format: date-time }
        hold_until: { type: [string, "null"], format: date-time }
        pinned_by_breaker:
          type: boolean
          description: Pinned by the loop breaker until an Owner clears it.
        baseline: { type: boolean }
        copied_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        version_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        purge_requested_at: { type: [string, "null"], format: date-time }
        purge_refused_at:
          type: [string, "null"]
          format: date-time
          description: >-
            A legal hold or WORM refused the last purge. Nothing is waiting: the file can be
            recalled and placed, and a purge can be asked for again.
        purged_at: { type: [string, "null"], format: date-time }
        copy_refusals:
          type: integer
          description: >-
            Azure's read-back refused this many of the file's copies in a row, one per
            version; 0 once a version verifies.
        copy_refused_at: { type: [string, "null"], format: date-time }
        copy_stopped:
          description: >-
            An ArchiveAdmin stopped copying it again (`copy-stop`), until a version
            verifies or they resume it.
          oneOf: [{ $ref: "#/components/schemas/AnnexFileMark" }, { type: "null" }]
        copy_refused_ack:
          description: >-
            An ArchiveAdmin acknowledged the refusals (`copy-refused-ack`): the alert is
            quiet for this file until a version verifies.
          oneOf: [{ $ref: "#/components/schemas/AnnexFileMark" }, { type: "null" }]
    AnnexFileMark:
      type: object
      required: [by, at]
      properties:
        by: { type: string }
        at: { type: string, format: date-time }
    AnnexTimeline:
      type: object
      required: [annex_id, baseline, days]
      properties:
        annex_id: { $ref: "#/components/schemas/Id" }
        baseline:
          type: object
          properties:
            at: { type: [string, "null"], format: date-time }
            files: { type: [integer, "null"] }
            bytes: { type: [integer, "null"] }
        days:
          type: array
          items:
            type: object
            required: [date, arrived, left, changed, copied, verified, bytes_copied]
            properties:
              date: { type: string, format: date }
              arrived: { type: integer }
              left: { type: integer }
              changed: { type: integer }
              copied: { type: integer }
              verified: { type: integer }
              bytes_copied: { type: integer }
    AnnexProblems:
      type: object
      required: [annex_id, drift_counts, drift, events]
      properties:
        annex_id: { $ref: "#/components/schemas/Id" }
        drift_counts:
          type: object
          description: Unresolved drift by kind.
          additionalProperties: { type: integer }
        drift:
          description: >-
            Each drift names a NAS path: ArchiveAdmins and apps get the rows,
            others an empty list (drift_counts says how many).
          type: array
          items:
            type: object
            required: [drift_id, kind, path, detected_at, resolved]
            properties:
              drift_id: { $ref: "#/components/schemas/Id" }
              kind:
                type: string
                x-extensible-enum: [missed_arrival, missed_departure, changed_no_event,
                                    copy_mismatch]
              path: { type: string }
              expected: { type: [object, "null"], additionalProperties: true }
              observed: { type: [object, "null"], additionalProperties: true }
              detected_at: { type: string, format: date-time }
              last_seen_at: { type: string, format: date-time }
              resolved: { type: boolean }
        events: { type: array, items: { $ref: "#/components/schemas/AnnexEvent" } }
        copies_refused:
          description: >-
            Files still on the NAS whose copy Azure's read-back refuses, however long ago,
            stopped ones first: a stopped file stays here until a version verifies or it
            is resumed. ArchiveAdmins and apps see every one; others the files they may
            read. At most 200 are listed: `copies_refused_total` says how many there are.
            `at_bound`: refused `MAX_REFUSALS` (3) times in a row, so the service no
            longer asks for it. `alerting`: the alert is up for it (at the bound, or
            stopped whatever its count, and not acknowledged).
          type: array
          items:
            type: object
            required: [file_id, path, at_bound, alerting, copy_refusals, copy_refused_at,
                       copy_stopped, copy_refused_ack]
            properties:
              file_id: { $ref: "#/components/schemas/Id" }
              path: { type: string }
              at_bound: { type: boolean }
              alerting: { type: boolean }
              copy_refusals: { type: integer }
              copy_refused_at: { type: [string, "null"], format: date-time }
              copy_stopped:
                oneOf: [{ $ref: "#/components/schemas/AnnexFileMark" }, { type: "null" }]
              copy_refused_ack:
                oneOf: [{ $ref: "#/components/schemas/AnnexFileMark" }, { type: "null" }]
        copies_refused_total:
          type: integer
          description: How many refused copies there are, of which `copies_refused` lists 200.
        read_set:
          description: >-
            Decision 63: an annexed file is hidden from everyone until its edge has read
            every folder above it, up to the export's root. `ready`: a folder pass has
            done so (`read_at`); before the first, every file is hidden. `folders`: the
            folders read so far, and `unreadable` those whose ACL can't be read, which
            hide what is below them.
          type: object
          required: [ready, filer_answered, read_at, folders, unreadable]
          properties:
            ready: { type: boolean }
            filer_answered:
              type: boolean
              description: >-
                Decision 65: the filer's question (does its share or export limit access?)
                has been answered. Until it is, every file is hidden.
            read_at: { type: [string, "null"], format: date-time }
            folders: { type: integer }
            unreadable: { type: integer }
    Id:
      type: string
      pattern: "^[0-9]{1,19}$"
      description: 64-bit integer as a decimal string.
    Uuid:
      type: string
      format: uuid
    Sid:
      type: string
      pattern: "^S-1-[0-9]+(-[0-9]+){1,15}$"
    Nanos:
      type: string
      pattern: "^-?[0-9]{1,20}$"
      description: Nanoseconds since the Unix epoch, as a decimal string.
    NextCursor:
      type: [string, "null"]
      description: Opaque; null at the end. Valid for 1 hour.
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", description: Decimal; the low end of a range. }
        high: { type: string, pattern: "^-?[0-9]+(\\.[0-9]+)?$", description: Present for a range. }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
    LogicalTier:
      type: string
      x-extensible-enum: [hot, warm, cold, archive, smart]
      description: Response-side, open (portal-api.md 1). Requests use PinTier.
    PinTier:
      type: string
      enum: [hot, warm, cold, archive]
    RecallState:
      type: string
      enum: [requested, rehydrating, copying, downloading, available, failed, cancelled, superseded]
      description: |
        `superseded`: the file was replaced or deleted while it was being recalled, so the
        recall stopped (`Recall.superseded` says which). Not a failure.
    ProposalState:
      type: string
      enum: [pending, approved, rejected, withdrawn, superseded]
    Role:
      type: string
      enum: [ArchiveAdmin, DataSteward, User]

    Check:
      type: object
      required: [severity, code, message]
      properties:
        severity: { type: string, enum: [error, warning, info] }
        code: { type: string, description: See portal-api.md section 8. }
        message: { type: string }
        field: { type: [string, "null"], description: "Body field it concerns, e.g. cold_day or notify.owners." }
        share_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        fee: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }] }

    GroupRef:
      examples:
        - {"sid": "S-1-5-21-1000-2000-3000-1102", "display_name": "Geoscience readers", "sam_account_name": "geo-readers"}
      type: object
      required: [sid]
      properties:
        sid: { $ref: "#/components/schemas/Sid" }
        display_name: { type: [string, "null"] }
        sam_account_name: { type: [string, "null"] }

    PersonRef:
      examples:
        - {"kind": "identity", "display_name": "Ada Admin", "app_id": null, "identity_id": "11"}
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [identity, application, system] }
        display_name: { type: [string, "null"] }
        app_id: { type: [string, "null"] }
        identity_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: "kind identity: compare with Me.identity_id to recognise your own rows. The server still decides." }

    Me:
      examples:
        - {"object_id": "33333333-3333-4333-8333-333333333333", "identity_id": "17", "display_name": "Rita Reader", "upn": "rita@contoso.com", "sid": "S-1-5-21-1000-2000-3000-1003", "roles": ["User"], "groups_source": "token", "groups_resolved_at": "2026-10-06T09:30:00.000Z", "owner_of": [], "writer_of": [], "reader_of": ["4"]}
      type: object
      required: [object_id, roles, groups_source, owner_of, writer_of, reader_of]
      properties:
        object_id: { $ref: "#/components/schemas/Uuid" }
        identity_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: The catalog identity; null for a cloud-only user (no on-premises SID). }
        display_name: { type: [string, "null"] }
        upn: { type: [string, "null"] }
        sid: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        groups_source: { type: string, enum: [token, graph, winbind, pending, none], description: "pending: over 200 groups; ACL-checked routes answer 503 groups_pending until the worker has resolved them." }
        groups_resolved_at: { type: [string, "null"], format: date-time }
        owner_of: { type: array, items: { $ref: "#/components/schemas/Id" }, description: Share ids. }
        writer_of: { type: array, items: { $ref: "#/components/schemas/Id" } }
        reader_of: { type: array, items: { $ref: "#/components/schemas/Id" } }
        prices_visible:
          type: boolean
          description: >-
            False when an ArchiveAdmin hid prices from all of this user's roles (section 5.24):
            every amount in this user's answers is then null, and the portal shows no costs.

    Session:
      examples:
        - {"authenticated": true, "user": {"object_id": "33333333-3333-4333-8333-333333333333", "identity_id": "17", "display_name": "Rita Reader", "upn": "rita@contoso.com", "sid": "S-1-5-21-1000-2000-3000-1003", "roles": ["User"], "groups_source": "token", "groups_resolved_at": "2026-10-06T09:30:00.000Z", "owner_of": [], "writer_of": [], "reader_of": ["4"]}, "csrf_token": "q8Jx0wJ3c1m2wq8Jx0wJ3c1m2wq8Jx0wJ3c1m2wq8J", "expires_at": "2026-10-06T19:30:00.000Z", "idle_expires_at": "2026-10-06T10:30:00.000Z", "auth_time": "2026-10-06T09:30:00.000Z"}
      type: object
      required: [authenticated, user, csrf_token, expires_at, idle_expires_at, auth_time]
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: "#/components/schemas/Me" }
        csrf_token: { type: string }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
        auth_time: { type: string, format: date-time }

    WormState:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        mode: { type: [string, "null"], enum: [unlocked_test, locked, null] }
        retention_days: { type: [integer, "null"] }
        enabled_at: { type: [string, "null"], format: date-time }
        lock_deadline: { type: [string, "null"], format: date-time, description: When the policy locks; shown in the portal. }
        locked_at: { type: [string, "null"], format: date-time }
        policy_state: { type: string, enum: [none, unlocked, locked], description: The backend container policy as last synced. }

    Share:
      examples:
        - {"share_id": "4", "name": "long-term-storage", "dataset_id": "2", "dataset_name": "seismic", "edge_id": "1", "root_dir_id": "100", "protocols": ["nfs4", "smb"], "nfs_sec": ["krb5p"], "nfs_clients": [], "root_squash": true, "trust_level": "proven", "host_trust_override": false, "groups": {"owners": {"sid": "S-1-5-21-1000-2000-3000-1100", "display_name": "Geo data owners", "sam_account_name": "geo-owners"}, "writers": null, "readers": {"sid": "S-1-5-21-1000-2000-3000-1102", "display_name": "Geoscience readers", "sam_account_name": "geo-readers"}}, "on_open": "auto", "wait_threshold_minutes": 30, "quiet_s": null, "quiet_default_s": 10, "quiet_supported": true, "edge_name": "edge-houston-1", "rewind": {"depth_days": 30, "max_days": 90, "labels": {"daily_at_utc": "00:00", "hourly_for_hours": 24}}, "worm": {"enabled": false, "mode": null, "retention_days": null, "enabled_at": null, "lock_deadline": null, "locked_at": null, "policy_state": "none"}, "last_full_acl_scan_at": "2026-10-06T09:30:00.000Z", "my_access": {"owner": false, "writer": false, "reader": true, "can_read_root": true}, "checks": [{"severity": "info", "code": "kerberos_throughput", "message": "krb5p costs about 77% of NFS IOPS.", "field": "nfs_sec", "share_id": "4", "fee": null}], "etag": "\"7\""}
      type: object
      required: [share_id, name, dataset_id, root_dir_id, protocols, nfs_sec, trust_level, groups, on_open, quiet_s, quiet_default_s, quiet_supported, rewind, worm, my_access, checks, etag]
      properties:
        share_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        dataset_id: { $ref: "#/components/schemas/Id" }
        dataset_name: { type: string }
        edge_id: { $ref: "#/components/schemas/Id" }
        root_dir_id: { $ref: "#/components/schemas/Id" }
        path: { type: string, description: "The folder the share serves, from the dataset's root: `/` for a root share, e.g. `/projects/2026` for a folder share. M6." }
        protocols: { type: array, items: { type: string, enum: [nfs3, nfs4, smb] } }
        nfs_sec: { type: array, items: { type: string, enum: [sys, krb5, krb5i, krb5p] } }
        nfs_clients: { type: array, items: { type: string }, description: ArchiveAdmin only; empty for others. }
        root_squash: { type: boolean }
        trust_level: { type: string, enum: [proven, host_trusted] }
        host_trust_override: { type: boolean }
        nfs_export_id: { type: integer, minimum: 2, maximum: 65535, description: "Ganesha's Export_Id on the edge; fixed for the share's life. M6." }
        smb_encrypt: { type: boolean, description: "SMB3 encryption required. M6." }
        groups:
          type: object
          required: [owners]
          properties:
            owners: { $ref: "#/components/schemas/GroupRef" }
            writers: { oneOf: [{ $ref: "#/components/schemas/GroupRef" }, { type: "null" }] }
            readers: { oneOf: [{ $ref: "#/components/schemas/GroupRef" }, { type: "null" }] }
        on_open: { type: string, enum: [wait, fail, auto] }
        wait_threshold_minutes: { type: [integer, "null"], minimum: 1 }
        quiet_s: { type: [integer, "null"], minimum: 10, maximum: 600, description: "How long a file must sit untouched before it counts as finished, in seconds; null for the share's default (decision 67)." }
        quiet_default_s: { type: integer, description: "The default a share with no quiet_s takes, as its edge last reported it in the heartbeat; until then 60 on a WORM share and 10 on any other." }
        quiet_supported: { type: boolean, description: "The share's edge sets a quiet period per share: it has reported its defaults in the heartbeat. False for an edge that predates decision 67 or hasn't sent a heartbeat since. It doesn't say the edge has this share's latest value yet; that comes through the feed within seconds." }
        edge_name: { type: [string, "null"], description: "The share's edge, by name." }
        rewind:
          type: object
          required: [depth_days, max_days]
          properties:
            depth_days: { type: integer, minimum: 0 }
            max_days: { type: integer, minimum: 0 }
            labels: { type: object, additionalProperties: true }
        worm: { $ref: "#/components/schemas/WormState" }
        last_full_acl_scan_at: { type: [string, "null"], format: date-time }
        my_access:
          type: object
          required: [owner, writer, reader, can_read_root]
          properties:
            owner: { type: boolean }
            writer: { type: boolean }
            reader: { type: boolean }
            can_read_root: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" } }
        etag: { type: string }

    ShareSettingsPatch:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        on_open: { type: string, enum: [wait, fail, auto] }
        wait_threshold_minutes: { type: [integer, "null"], minimum: 1, maximum: 1440 }
        quiet_s: { type: [integer, "null"], minimum: 10, maximum: 600, description: "Seconds, or null for the share's default. Owners or ArchiveAdmin (decision 67)." }
        quiet_s_confirmed: { type: boolean, description: "Required as true to set a WORM share's quiet_s below 60 s: a paused copy can leave a half-written version kept until retention ends. The audit records it." }
        rewind_depth_days: { type: integer, minimum: 0, maximum: 36500 }
        rewind_depth_max_days: { type: integer, minimum: 0, maximum: 36500 }
        nfs_sec: { type: array, items: { type: string, enum: [sys, krb5, krb5i, krb5p] }, minItems: 1 }
        nfs_clients: { type: array, items: { type: string, maxLength: 255 }, maxItems: 256 }
        root_squash: { type: boolean }
        host_trust_override:
          type: object
          required: [enabled, reason]
          properties:
            enabled: { type: boolean }
            reason: { type: string, minLength: 1, maxLength: 1000 }

    ShareAccess:
      type: object
      required: [owners_group_sid]
      additionalProperties: false
      properties:
        owners_group_sid: { $ref: "#/components/schemas/Sid" }
        writers_group_sid: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }
        readers_group_sid: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }

    WormEnable:
      type: object
      required: [retention_days, confirm_name]
      additionalProperties: false
      properties:
        retention_days: { type: integer, minimum: 1, maximum: 36500 }
        confirm_name: { type: string, maxLength: 255, description: Must equal the share name exactly. }
        window_hours: { type: integer, minimum: 1, maximum: 24, default: 24 }
        quiet_s_confirmed: { type: boolean, default: false, description: "Required as true when the share's own quiet period is below 60 s: as a WORM share, a paused copy could leave a half-written version kept until retention ends. The audit records it (decision 67)." }

    TierState:
      type: object
      required: [logical, archived]
      properties:
        logical: { oneOf: [{ $ref: "#/components/schemas/LogicalTier" }, { type: "null" }] }
        native_class: { type: [string, "null"], description: "Hot, Cool, Cold, Archive, Smart; STANDARD, GLACIER, ..." }
        archived: { type: boolean, description: A read needs a restore. }
        restore_state: { type: [string, "null"], x-extensible-enum: [in_progress, completed, expired, failed] }
        restore_expires_at: { type: [string, "null"], format: date-time }
        explicit_tier_set: { type: boolean, description: The blob has left Smart for good (decision 29). }
        tier_changed_at: { type: [string, "null"], format: date-time }

    PinSummary:
      type: object
      required: [pin_id, tier]
      properties:
        pin_id: { $ref: "#/components/schemas/Id" }
        tier: { $ref: "#/components/schemas/PinTier" }
        until: { type: [string, "null"], format: date-time }
        override_archive: { type: boolean }
        inherited_from: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: The folder the pin is on, if not this item. }

    Holds:
      type: object
      required: [legal]
      properties:
        keep_online_until: { type: [string, "null"], format: date-time, description: Latest active keep_online hold; "null" with keep_online true means until released. }
        keep_online: { type: boolean }
        legal: { type: boolean }
        items:
          type: array
          description: The active holds that apply, on the item or a folder above it.
          items:
            type: object
            required: [hold_id, kind]
            properties:
              hold_id: { $ref: "#/components/schemas/Id" }
              kind: { type: string, enum: [keep_online, legal] }
              until: { type: [string, "null"], format: date-time }
              inherited_from: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
              set_by_identity_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }

    ActiveRecall:
      type: object
      required: [recall_id, state]
      properties:
        recall_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/RecallState" }
        eta: { type: [string, "null"], format: date-time }

    Entry:
      examples:
        - {"file_id": "1042", "name": "line_1042.segy", "kind": "file", "symlink_target": null, "size": 197568495616, "mtime": "2026-02-11T14:03:22.000Z", "mtime_ns": "1770818602000000000", "state": "stub", "resident_bytes": 4194304, "version_id": "5501", "tier": {"logical": "archive", "native_class": "Archive", "archived": true, "restore_state": null, "restore_expires_at": null, "explicit_tier_set": true, "tier_changed_at": "2026-03-01T00:00:00.000Z"}, "archive_at": "2026-03-01", "next_action": null, "next_action_at": null, "pin": null, "holds": {"keep_online": false, "keep_online_until": null, "legal": false, "items": []}, "active_recall": {"recall_id": "88", "state": "rehydrating", "eta": null}}
      type: object
      required: [file_id, name, kind, size, state, tier, holds]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { type: string, enum: [file, dir, symlink] }
        symlink_target: { type: [string, "null"] }
        size: { type: integer, minimum: 0 }
        mtime: { type: [string, "null"], format: date-time }
        mtime_ns: { oneOf: [{ $ref: "#/components/schemas/Nanos" }, { type: "null" }] }
        state: { type: string, x-extensible-enum: [landing, uploading, resident, stub, recalling, remote] }
        resident_bytes: { type: integer, minimum: 0 }
        version_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: The content version. }
        tier: { $ref: "#/components/schemas/TierState" }
        archive_at: { type: [string, "null"], format: date }
        next_action: { type: [string, "null"], enum: [tier_warm, tier_cold, archive, stub, prune_versions, null], description: Null while `move_hold` is set. }
        next_action_at: { type: [string, "null"], format: date-time, description: Null while `move_hold` is set. }
        move_hold:
          description: >-
            The file's pin wants another tier, and the move is waiting. A file that wants
            a different tier from the files sharing its storage gets its own copy
            (decision 66). This one couldn't, so it stays where it is and tries again
            within a day. Only a move to Archive may move shared storage over a file that
            differs. Null otherwise.
          oneOf:
            - type: object
              required: [to, until]
              properties:
                to: { $ref: "#/components/schemas/LogicalTier" }
                until: { type: string, format: date-time, description: When the move tries again. }
            - { type: "null" }
        read_back_failed_at:
          type: [string, "null"]
          format: date-time
          description: >-
            The cloud copy could not be checked: its read-back found other bytes, or kept
            failing until the worker gave up. The file stays on the file server, it won't
            become a stub, and nothing tries again without an administrator. Null otherwise.
        pin: { oneOf: [{ $ref: "#/components/schemas/PinSummary" }, { type: "null" }] }
