      summary: Scan a source before registering it (cloud-connect.md 4) - a capped, read-only listing (or its S3 Inventory) by the worker, with prefixes, the storage-class mix, a restore estimate and suggested waves. Poll GET /v1/source-scans/{scan_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [backend_id, bucket, prefix]
              properties:
                backend_id: { $ref: "#/components/schemas/Id" }
                bucket: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" }
                prefix: { type: string, maxLength: 1024 }
                inventory:
                  description: "Read this S3 Inventory instead of listing (s3_inventory or listing; S3 Metadata tables are read by the seed, not the scan)."
                  oneOf:
                    - $ref: "#/components/schemas/SourceInventoryS3Inventory"
                    - $ref: "#/components/schemas/SourceInventoryListing"
                    - { type: "null" }
                max_objects: { type: integer, minimum: 1000, maximum: 10000000, default: 2000000 }
                max_seconds: { type: integer, minimum: 10, maximum: 1800, default: 300 }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceScan" }
        default: { $ref: "#/components/responses/Problem" }

