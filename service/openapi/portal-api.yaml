      type: object
      required: [migration_id, state, cut_over_at, source_deletes_pending, applied_by_omnifile, items, next_cursor]
      properties:
        migration_id: { $ref: "#/components/schemas/Id" }
        state: { type: string, x-extensible-enum: [pending, copying, verifying, verified, cut_over, failed, cancelled] }
        cut_over_at: { type: [string, "null"], format: date-time }
        source_deletes_pending: { type: integer, description: "Every row of the report (0 items are returned to an ArchiveAdmin with no AD identity)." }
        applied_by_omnifile: { type: boolean, const: false, description: OmniFile never applies these to the source (decision 40). }
        items: { type: array, items: { $ref: "#/components/schemas/Tombstone" } }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    StuckCopies:
      examples:
        - {"migration_id": "7", "kind": "no_checksum", "count": 1, "counted_at": "2026-10-15T10:02:00.000Z", "list_limit": 10000, "items": [{"object_key": "raw/2019/sse_c.segy"}], "next_cursor": null}
      type: object
      required: [migration_id, kind, count, counted_at, list_limit, items, next_cursor]
      properties:
        migration_id: { $ref: "#/components/schemas/Id" }
        kind: { type: string, enum: [stranded, no_checksum] }
        count: { type: integer, description: "All of this kind when the worker last looked: the same number as stuck_copies, read from its count and never counted here." }
        counted_at: { type: [string, "null"], format: date-time, description: "When the worker last looked, at least hourly while the prefix waits on a check; null if it hasn't." }
        list_limit: { type: integer, description: "The worker lists at most this many of each kind, the first by key. When count is higher, excluding them lets the next ones show at the next sweep." }
        items:
          type: array
          description: "S3 keys, for the Exclude action. Objects excluded since the worker last looked are left out. None for an ArchiveAdmin with no AD identity."
          items:
            type: object
            required: [object_key]
            properties:
              object_key: { type: string }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    ConsoleRow:
      description: One migration in the console - a Migration plus bytes, throughput, ETA, health and the next planned wave.
      allOf:
        - $ref: "#/components/schemas/Migration"
        - type: object
          required: [dataset_name, bytes, counted_at, failing_now, throughput, eta, health, restores_expiring, archived_waiting, next_wave]
          properties:
            dataset_name: { type: string }
            counted_at: { type: [string, "null"], format: date-time, description: "When the worker last counted it (every 5 minutes); null before the first count." }
            failing_now: { type: integer, minimum: 0, description: "Copies that failed their check whose file has no verified copy yet (files.failed only ever grows)." }
            bytes:
              type: object
              required: [total, verified]
              properties:
                total: { type: integer, minimum: 0, description: Bytes of the live files under the prefix. }
                verified: { type: integer, minimum: 0, description: Of those, bytes with a verified copy. }
            throughput:
              description: "From the worker's samples of the last hour (at least 10 minutes apart); null when nothing was verified in them."
              oneOf:
                - type: "null"
                - type: object
                  required: [bytes_per_s, files_per_h, basis]
                  properties:
                    bytes_per_s: { type: number }
                    files_per_h: { type: integer }
                    basis: { type: string }
            eta:
              type: object
              required: [at, basis]
              description: "at is null when the data can't support a time: nothing verified in the last hour, or objects still in an S3 archive class."
              properties:
                at: { type: [string, "null"], format: date-time }
                basis: { type: string }
            health: { type: string, x-extensible-enum: [ok, attention, failing, done, cancelled] }
            restores_expiring: { type: integer, minimum: 0 }
            archived_waiting: { type: integer, minimum: 0, description: Objects still in GLACIER or DEEP_ARCHIVE with no finished restore. }
            next_wave:
              oneOf:
                - type: "null"
                - type: object
                  required: [plan_id, plan_name, seq, name, start_at, waiting_reason]
                  properties:
                    plan_id: { $ref: "#/components/schemas/Id" }
                    plan_name: { type: string }
                    seq: { type: integer }
                    name: { type: string }
                    start_at: { type: string, format: date-time }
                    waiting_reason: { type: [string, "null"] }

    AttentionItem:
      type: object
      required: [kind, migration_id, message, actions]
      properties:
        kind: { type: string, x-extensible-enum: [access, verify_failed, check_given_up, copy_stranded, no_checksum, run_failed, restore_expiring, failed, agent_offline, seeding] }
        migration_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        source_id: { $ref: "#/components/schemas/Id" }
        agent: { type: string }
        message: { type: string }
        actions:
          type: array
          description: "The fixes on offer - rerun (Copy again), exclude (re-auth), restore_again, retry, settings (a Settings check), agents (the Agents view), wait."
          items: { type: string, x-extensible-enum: [rerun, exclude, restore_again, retry, settings, agents, wait] }

    MigrationConsole:
      type: object
      required: [computed_at, migrations, attention]
      properties:
        computed_at: { type: string, format: date-time }
        migrations: { type: array, items: { $ref: "#/components/schemas/ConsoleRow" } }
        attention: { type: array, items: { $ref: "#/components/schemas/AttentionItem" } }

    MoverAgent:
      type: object
      required: [name, status, version, host, arc_resource_id, last_status_at, error, polled_at, stale]
      description: A Storage Mover agent as the worker last read it through ARM.
      properties:
        name: { type: string }
        status: { type: [string, "null"], description: "Storage Mover's agentStatus (Online, Offline, ...), as given." }
        version: { type: [string, "null"] }
        host: { type: [string, "null"] }
        arc_resource_id: { type: [string, "null"] }
        last_status_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        polled_at: { type: string, format: date-time }
        stale: { type: boolean, description: Not read for 15 minutes. }

    ConsoleEdge:
      oneOf:
        - type: "null"
        - type: object
          required: [edge_id, name, status, software_version, last_heartbeat_at, guard_state]
          properties:
            edge_id: { $ref: "#/components/schemas/Id" }
            name: { type: string }
            status: { type: string, x-extensible-enum: [ok, attention, silent, pending] }
            software_version: { type: [string, "null"] }
            last_heartbeat_at: { type: [string, "null"], format: date-time }
            guard_state: { type: [string, "null"] }

    MigrationWork:
      type: object
      required: [migration_id, copier_kind, storage_mover, edge, restore_waves, checksum_jobs, verification]
      properties:
        migration_id: { $ref: "#/components/schemas/Id" }
        copier_kind: { type: string }
        storage_mover:
          oneOf:
            - type: "null"
            - type: object
              required: [job_ref, last_run, agents, agentless]
              properties:
                job_ref: { type: [string, "null"] }
                last_run: { type: [object, "null"] }
                agents: { type: array, items: { $ref: "#/components/schemas/MoverAgent" } }
                agentless: { type: boolean, description: "A cloud-to-cloud job (S3 through the Arc multicloud connector) runs without an agent." }
        edge: { $ref: "#/components/schemas/ConsoleEdge" }
        restore_waves:
          type: array
          items:
            type: object
            required: [wave_id, job_id, state, objects, restored, open, speed, days, requested_at, finished_at, first_expiry, failure]
            properties:
              wave_id: { $ref: "#/components/schemas/Id" }
              job_id: { type: [string, "null"] }
              state: { type: string }
              objects: { type: integer }
              restored: { type: integer }
              open: { type: integer }
              speed: { type: string }
              days: { type: integer }
              requested_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              first_expiry: { type: [string, "null"], format: date-time }
              failure: { type: [string, "null"] }
        checksum_jobs:
          type: array
          items:
            type: object
            required: [checksum_job_id, job_id, state, objects, found, requested_at, finished_at, failure]
            properties:
              checksum_job_id: { $ref: "#/components/schemas/Id" }
              job_id: { type: [string, "null"] }
              state: { type: string }
              objects: { type: integer }
              found: { type: [integer, "null"] }
              requested_at: { type: string, format: date-time }
              finished_at: { type: [string, "null"], format: date-time }
              failure: { type: [string, "null"] }
        verification:
          type: object
          required: [total, verified, failed, excluded, bytes, journal_checked_through, archived_waiting]
          properties:
            total: { type: [integer, "null"] }
            verified: { type: integer }
            failed: { type: integer }
            excluded: { type: integer }
            bytes: { type: object, required: [total, verified], properties: { total: { type: integer }, verified: { type: integer } } }
            journal_checked_through: { type: [string, "null"], format: date-time }
            archived_waiting: { type: integer }

    MigrationAgents:
      type: object
      required: [agents, jobs, polled]
      properties:
        agents: { type: array, items: { $ref: "#/components/schemas/MoverAgent" } }
        polled: { type: boolean, description: "False when the worker has listed no agents (none registered, or no Storage Mover configured)." }
        jobs:
          type: array
          items:
            type: object
            required: [migration_id, dataset_name, prefix, state, copier_kind, job_ref, run_state, run_counters, edge, restore_waves_running, checksum_jobs_running]
            properties:
              migration_id: { $ref: "#/components/schemas/Id" }
              dataset_name: { type: string }
              prefix: { type: string }
              state: { type: string }
              copier_kind: { type: string }
              job_ref: { type: [string, "null"] }
              run_state: { type: [string, "null"] }
              run_counters: { type: object, additionalProperties: { type: integer } }
              edge: { $ref: "#/components/schemas/ConsoleEdge" }
              restore_waves_running: { type: integer }
              checksum_jobs_running: { type: integer }

    WaveWindow:
      oneOf:
        - type: "null"
        - type: object
          additionalProperties: false
          required: [start, end]
          description: A daily window in UTC; an end before the start wraps past midnight.
          properties:
            start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
            end: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }

    Blackout:
      type: object
      additionalProperties: false
      required: [from, to]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    WaveCreate:
      type: object
      additionalProperties: false
      required: [prefixes, start_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        prefixes: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 1024 } }
        start_at: { type: string, format: date-time }
        window: { $ref: "#/components/schemas/WaveWindow" }
        blackouts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Blackout" } }
        after: { type: [integer, "null"], minimum: 1, description: The number of an earlier wave that must be verified first. }
        cutover: { type: string, enum: [auto, manual], default: auto }
        copier: { type: string, enum: [auto, external], default: auto, description: "external is refused for now (422 action_not_allowed): an external copier's run reports can't reach a plan's migrations." }
        bandwidth_mbps: { type: [integer, "null"], minimum: 1, description: Advisory - shown, not applied. }
        egress_gb_per_day: { type: [integer, "null"], minimum: 1, description: Advisory - shown, not applied. }

    MigrationPlanCreate:
      type: object
      additionalProperties: false
      required: [dataset_id, name, waves]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        name: { type: string, minLength: 1, maxLength: 120 }
        owner_identity_id: { $ref: "#/components/schemas/Id", description: "An AD user in the sources' Owners or Writers group. A signed-in ArchiveAdmin may leave it out (themself)." }
        waves: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/WaveCreate" } }

    WavePatch:
      type: object
      additionalProperties: false
      required: [base_version]
      properties:
        base_version: { type: integer, description: The plan's version you edited. }
        start_at: { type: string, format: date-time }
        window: { $ref: "#/components/schemas/WaveWindow" }
        blackouts: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Blackout" } }
        after: { type: [integer, "null"], minimum: 1 }
        cutover: { type: string, enum: [auto, manual] }

    PlanDecision:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 500 }

    MigrationWave:
      type: object
      required: [seq, name, prefixes, start_at, window, blackouts, after, cutover, copier, bandwidth_mbps, egress_gb_per_day, state, waiting_reason, started_at, verified_at, cut_over_at, migrations]
      properties:
        seq: { type: integer }
        name: { type: string }
        prefixes: { type: array, items: { type: string } }
        start_at: { type: string, format: date-time }
        window: { $ref: "#/components/schemas/WaveWindow" }
        blackouts: { type: array, items: { $ref: "#/components/schemas/Blackout" } }
        after: { type: [integer, "null"] }
        cutover: { type: string, x-extensible-enum: [auto, manual] }
        copier: { type: string, x-extensible-enum: [auto, external] }
        bandwidth_mbps: { type: [integer, "null"] }
        egress_gb_per_day: { type: [integer, "null"] }
        state: { type: string, x-extensible-enum: [planned, waiting, blocked, started, verified, cut_over, failed, cancelled], description: "blocked - the wave it waits for was cancelled, so it never starts; cancelled - by the plan, or all its migrations were." }
        waiting_reason: { type: [string, "null"] }
        started_at: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        cut_over_at: { type: [string, "null"], format: date-time }
        migrations:
          type: array
          items:
            type: object
            required: [prefix, migration_id, state]
            properties:
              prefix: { type: string }
              migration_id: { $ref: "#/components/schemas/Id" }
              state: { type: string }

    MigrationPlan:
      examples:
        - {"plan_id": "3", "dataset_id": "1", "name": "Seismic by year", "state": "approved", "owner": {"identity_id": "11", "display_name": "Ada Admin"}, "proposed_by": "user:11", "decided_by": "user:11", "decided_at": "2026-11-01T09:00:00.000Z", "decision_note": null, "version": 1, "created_at": "2026-11-01T09:00:00.000Z", "updated_at": "2026-11-01T09:00:00.000Z", "waves": [{"seq": 1, "name": "2016-2017", "prefixes": ["raw/2016/", "raw/2017/"], "start_at": "2026-11-03T22:00:00.000Z", "window": {"start": "22:00", "end": "06:00"}, "blackouts": [], "after": null, "cutover": "auto", "copier": "auto", "bandwidth_mbps": 500, "egress_gb_per_day": null, "state": "started", "waiting_reason": null, "started_at": "2026-11-03T22:00:00.000Z", "verified_at": null, "cut_over_at": null, "migrations": [{"prefix": "raw/2016/", "migration_id": "11", "state": "copying"}]}]}
      type: object
      required: [plan_id, dataset_id, name, state, owner, proposed_by, decided_by, decided_at, decision_note, version, created_at, updated_at, waves]
      properties:
        plan_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        state: { type: string, x-extensible-enum: [proposed, approved, rejected, done, cancelled] }
        owner:
          type: object
          required: [identity_id, display_name]
          properties:
            identity_id: { $ref: "#/components/schemas/Id" }
            display_name: { type: [string, "null"] }
        proposed_by: { type: string }
        decided_by: { type: [string, "null"] }
        decided_at: { type: [string, "null"], format: date-time }
        decision_note: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        waves: { type: array, items: { $ref: "#/components/schemas/MigrationWave" } }

    MigrationSplit:
      type: object
      required: [source_id, prefix, by, prefixes, loose, hidden, waves]
      properties:
        source_id: { $ref: "#/components/schemas/Id" }
        prefix: { type: string }
        by: { type: string, enum: [bytes, count] }
        prefixes:
          type: array
          items: { type: object, required: [prefix, files, bytes], properties: { prefix: { type: string }, files: { type: integer }, bytes: { type: integer } } }
        loose:
          type: object
          required: [files, bytes]
          description: Objects directly under the source prefix; they move only with the whole prefix.
          properties: { files: { type: integer }, bytes: { type: integer } }
        hidden:
          type: object
          required: [folders, files, bytes]
          description: "Folders a signed-in caller can't read: counted, never named, and left out of the waves (a role never grants read)."
          properties: { folders: { type: integer }, files: { type: integer }, bytes: { type: integer } }
        waves:
          type: array
          items: { type: object, required: [prefixes, files, bytes], properties: { prefixes: { type: array, items: { type: string } }, files: { type: integer }, bytes: { type: integer } } }

    RecallBatchCreate:
      type: object
      additionalProperties: false
      required: [dataset_id]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        paths: { type: array, minItems: 1, maxItems: 100, items: { type: string, maxLength: 4096 }, description: "Dataset paths (files or folders, from '/'); absent - the whole dataset." }
        due_by: { type: [string, "null"], format: date-time }
        priority: { type: [string, "null"], enum: [standard, high, null], description: "Null - the cheapest offered priority that meets due_by." }

    RecallBatchItem:
      type: object
      required: [file_id, path, status, priority, reason, eta, late, fee, recall_id]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        path: { type: string }
        status: { type: string, x-extensible-enum: [planned, started, joined, online, skipped] }
        priority: { type: [string, "null"], x-extensible-enum: [standard, high] }
        reason: { type: [string, "null"], description: Why a file was skipped. }
        eta: { type: [string, "null"], format: date-time }
        late: { type: boolean, description: No offered priority meets due_by; the fastest is used. }
        fee: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: In the currency of the price table that priced the file. }
        recall_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }

    RecallBatch:
      examples:
        - {"batch_id": "9", "dataset_id": "2", "paths": ["/seismic/raw/2019"], "due_by": "2026-10-20T00:00:00.000Z", "priority": null, "state": "starting", "counts": {"files": 120, "planned": 118, "started": 0, "joined": 0, "online": 2, "skipped": 0, "late": 0}, "bytes": 22080000000000, "eta": "2026-10-16T09:00:00.000Z", "eta_confidence": "provider_sla", "costs": [{"amount": "441.60", "currency": "USD"}], "cost": {"amount": "441.60", "currency": "USD"}, "created_at": "2026-10-15T09:00:00.000Z", "done_at": null}
      type: object
      required: [batch_id, dataset_id, paths, due_by, priority, state, counts, bytes, eta, eta_confidence, costs, cost, created_at, done_at]
      properties:
        batch_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        paths: { type: [array, "null"], items: { type: string } }
        due_by: { type: [string, "null"], format: date-time }
        priority: { type: [string, "null"] }
        state: { type: string, x-extensible-enum: [planning, starting, done] }
        counts:
          type: object
          required: [files, planned, started, joined, online, skipped, late]
          properties:
            files: { type: integer }
            planned: { type: integer }
            started: { type: integer }
            joined: { type: integer }
            online: { type: integer }
            skipped: { type: integer }
            late: { type: integer }
        bytes: { type: integer }
        eta: { type: [string, "null"], format: date-time, description: "When the last planned file should be back; null while planning, or when a file has no promised time (above the no-promise size)." }
        eta_confidence: { type: string, x-extensible-enum: [provider_sla, none] }
        costs: { type: array, items: { $ref: "#/components/schemas/Money" }, description: "The planned files' retrieval fees (an estimate), one total per currency, by currency code. A migrating dataset's files can be priced by two providers' tables; amounts in different currencies are never added." }
        cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: "The one total of costs when every fee is in one currency; null with no fee or with several currencies (read costs)." }
        created_at: { type: string, format: date-time }
        done_at: { type: [string, "null"], format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/RecallBatchItem" }, description: GET only. }
        next_cursor: { $ref: "#/components/schemas/NextCursor" }

    InlineBackend:
      type: object
      additionalProperties: false
      required: [kind, config]
      description: Finds a backend an ArchiveAdmin configured; never creates one. Any other config field is 422 config_invalid.
      properties:
        kind: { type: string, enum: [s3] }
        config:
          type: object
          additionalProperties: false
          properties:
            bucket: { type: string, minLength: 3, maxLength: 63 }
            container: { type: string, description: The bucket, by A's name for it. }
            region: { type: string }
            account_id: { type: string, pattern: "^[0-9]{12}$" }
            requester_pays: { type: boolean, description: Only false today. }
            private_network: { type: boolean, const: true, description: A partner can't turn it off. }

    PriceTable:
      type: object
      required: [backend_kind, currency, as_of, verify, classes]
      description: |
        Built-in tables live in service/src/omnifile_service/policy/prices/<kind>.json.
        Every number carries the table's as_of date; verify stays true until all are
        checked against the provider's price page. Prices are per GB-month and
        per 10,000 operations, as the provider states them.
      properties:
        id: { type: string }
        backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
        region: { type: [string, "null"] }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        as_of: { type: string, format: date }
        source: { type: [string, "null"], format: uri }
        verify: { type: boolean }
        overridden: { type: boolean, readOnly: true }
        etag: { type: string, readOnly: true }
        classes:
          type: object
          description: Keyed by native class (Hot, Cool, Cold, Archive, Smart, STANDARD, ...).
          additionalProperties:
            type: object
            properties:
              gb_month: { type: string }
              write_per_10k: { type: string }
              read_per_10k: { type: string }
              retrieval_per_gb: { type: string }
              retrieval_per_gb_high: { type: string }
              read_per_10k_high: { type: string }
              minimum_days: { type: [integer, "null"] }
              monitoring_per_10k_objects_month: { type: string }
              verify: { type: boolean }
        notes: { type: array, items: { type: string } }
        list:
          type: object
          readOnly: true
          description: >-
            The list prices: the built-in table, whatever the override says. The editor's
            "reset to list price" copies from it. Ignored in a PUT.
          required: [as_of, classes]
          properties:
            id: { type: string }
            region: { type: [string, "null"] }
            currency: { type: string }
            as_of: { type: string, format: date }
            classes: { type: object, additionalProperties: { type: object, additionalProperties: true } }
    PriceDisplay:
      type: object
      additionalProperties: false
      required: [show_to, set_by, set_at]
      properties:
        show_to:
          type: array
          description: >-
            The roles that see prices; `others` is every signed-in user with neither admin role.
            Empty: nobody (the ArchiveAdmins' price editor still shows the rates).
          items: { type: string, enum: [ArchiveAdmin, DataSteward, others] }
        set_by: { type: [string, "null"], description: Who last changed it. }
        set_at: { type: [string, "null"], format: date-time }

    Dataset:
      examples:
        - {"dataset_id": "2", "name": "seismic", "backend_kind": "azure_blob", "private_network": true, "storage_layout": "two_account", "migration_state": "steady", "shares": [{"share_id": "4", "name": "long-term-storage", "worm_enabled": false}], "active_policy": {"version": 3, "mode": "scheduled", "archive_day": 365}, "pending_proposals": 1}
      type: object
      required: [dataset_id, name, backend_kind, storage_layout, shares]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        backend_id: { $ref: "#/components/schemas/Id" }
        backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
        private_network: { type: boolean }
        edge_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: "The edge that serves it (v1: one)." }
        key_prefix: { type: string }
        root_dir_id: { $ref: "#/components/schemas/Id" }
        storage_layout: { type: string, x-extensible-enum: [two_account, single_account] }
        migration_state: { type: string, x-extensible-enum: [steady, migrating, cut_over], description: "handed_off is reserved (decision 35, migration-namespace.md)." }
        shares:
          type: array
          items:
            type: object
            required: [share_id, name]
            properties:
              share_id: { $ref: "#/components/schemas/Id" }
              name: { type: string }
              worm_enabled: { type: boolean }
        active_policy:
          oneOf:
            - type: "null"
            - type: object
              required: [version, mode]
              properties:
                version: { type: integer }
                mode: { type: string, enum: [scheduled, smart, m1] }
                archive_day: { type: [integer, "null"] }
        pending_proposals: { type: integer, minimum: 0 }

    Backend:
      examples:
        - {"backend_id": "1", "name": "azure-weu", "kind": "azure_blob", "private_network": true, "can_be_home": true}
      type: object
      required: [backend_id, name, kind, private_network, can_be_home]
      properties:
        backend_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
        private_network: { type: boolean }
        can_be_home: { type: boolean, description: "False for S3: a migration source, never a dataset's home (decision 18)." }

    NewShare:
      examples:
        - {"dataset_id": "2", "name": "long-term-storage", "protocols": ["nfs4", "smb"], "nfs_sec": ["krb5p"], "owners_group_sid": "S-1-5-21-1000-2000-3000-3003", "readers_group_sid": "S-1-5-21-1000-2000-3000-3001", "on_open": "auto", "wait_threshold_minutes": 10}
      type: object
      additionalProperties: false
      required: [dataset_id, name, protocols, owners_group_sid]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$", description: "The SMB share name and the NFS pseudo path; for a share of the dataset's root, also the root folder's name on the edge." }
        path: { type: string, default: "/", description: "The folder shared: `/` (the dataset's root, the default) or an existing folder such as `/projects/2026`. A folder needs the dataset's root shared first." }
        protocols: { type: array, minItems: 1, uniqueItems: true, items: { type: string, enum: [nfs3, nfs4, smb] } }
        nfs_sec: { type: array, uniqueItems: true, items: { type: string, enum: [sys, krb5, krb5i, krb5p] }, description: "NFS shares only. Any sys makes the share host-trusted (decision 28)." }
        nfs_clients: { type: array, items: { type: string }, description: "NFS shares only; required with sys, and never a wildcard." }
        root_squash: { type: boolean, default: true }
        owners_group_sid: { $ref: "#/components/schemas/Sid" }
        writers_group_sid: { $ref: "#/components/schemas/Sid" }
        readers_group_sid: { $ref: "#/components/schemas/Sid" }
        on_open: { type: string, enum: [wait, fail, auto], default: fail }
        wait_threshold_minutes: { type: integer, minimum: 1, description: "With on_open auto only." }
        smb_encrypt: { type: boolean, default: false }
        rewind_depth_days: { type: integer, minimum: 0, maximum: 3650, default: 0 }
        rewind_depth_max_days: { type: integer, minimum: 0, maximum: 3650, default: 0 }
        host_trust_override: { type: boolean, default: false, description: "Accept a sec=sys share over folders with a restricted group. Audited." }

    AuditRecord:
      examples:
        - {"audit_id": "90211", "at": "2026-10-06T09:30:00.000Z", "actor": "user:11", "actor_display_name": "Ada Admin", "actor_sid": "S-1-5-21-1000-2000-3000-1001", "proof": "proven", "trust_level": null, "action": "policy.approve", "decision": "allow", "dataset_id": "2", "share_id": null, "file_id": null, "version_id": null, "client_addr": "10.20.0.15", "details": {"proposal_id": "5", "version": 3}}
      type: object
      required: [audit_id, at, actor, action, decision]
      properties:
        audit_id: { $ref: "#/components/schemas/Id" }
        at: { type: string, format: date-time }
        actor: { type: string, description: "user:<identity_id>, app:<client id>, edge:<edge_id>, system:<job>" }
        actor_display_name: { type: [string, "null"] }
        actor_sid: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }
        proof: { type: [string, "null"], enum: [claimed, proven, null] }
        trust_level: { type: [string, "null"], enum: [proven, host_trusted, null] }
        action: { type: string }
        decision: { type: string, enum: [allow, deny, info] }
        dataset_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        share_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        file_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        version_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        client_addr: { type: [string, "null"], description: ArchiveAdmin only. }
        details: { type: object, additionalProperties: true }

    # --- Visual views (portal-api.md 5.22; WP13) ---------------------------------------------

    MapCount:
      type: object
      required: [files, bytes, local_bytes]
      properties:
        files: { type: integer, minimum: 0 }
        bytes: { type: integer, minimum: 0, description: "Sum of the files' sizes." }
        local_bytes: { type: integer, minimum: 0, description: "Bytes the edge holds for them (a stub keeps its first MB)." }

    FileJourney:
      examples:
        - {"file_id": "1042", "backend": {"kind": "azure_blob", "role": "home", "storage_layout": "two_account", "account": "archive", "migration_state": "steady"}, "tiers": [{"logical": "hot", "classes": [{"native_class": "Hot", "minimum_days": null, "needs_restore": false}]}, {"logical": "warm", "classes": [{"native_class": "Cool", "minimum_days": 30, "needs_restore": false}]}, {"logical": "cold", "classes": [{"native_class": "Cold", "minimum_days": 90, "needs_restore": false}]}, {"logical": "archive", "classes": [{"native_class": "Archive", "minimum_days": 180, "needs_restore": true}]}, {"logical": "smart", "classes": [{"native_class": "Smart", "minimum_days": null, "needs_restore": false}]}], "pin": null, "holds": [{"hold_id": "52", "kind": "keep_online", "until": "2026-10-20T09:30:00.000Z", "set_at": "2026-10-06T09:30:00.000Z", "set_by": {"kind": "identity", "display_name": "Ada Admin", "app_id": null, "identity_id": "11"}, "reason": "Processing run", "inherited_from": null}]}
      type: object
      required: [file_id, backend, tiers, pin, holds]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        backend:
          type: object
          required: [kind, role, storage_layout, account, migration_state]
          description: The backend that holds the primary copy now (the dataset's home if there is none yet).
          properties:
            kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
            role: { type: string, x-extensible-enum: [home, source, other], description: "source: the dataset's migration source." }
            storage_layout: { type: string, x-extensible-enum: [two_account, single_account] }
            account: { type: [string, "null"], x-extensible-enum: [live, archive, single], description: "Which account holds the copy (Azure layouts); null on S3 or without a copy." }
            migration_state: { type: string, x-extensible-enum: [steady, migrating, cut_over] }
        tiers:
          type: array
          description: "That backend's tiers from its capabilities, warmest first (hot, warm, cold, archive, then smart). Empty if its capabilities can't be read."
          items:
            type: object
            required: [logical, classes]
            properties:
              logical: { $ref: "#/components/schemas/LogicalTier" }
              classes:
                type: array
                description: The native classes behind it; the first is the default.
                items:
                  type: object
                  required: [native_class, minimum_days, needs_restore]
                  properties:
                    native_class: { type: string }
                    minimum_days: { type: [integer, "null"] }
                    needs_restore: { type: boolean }
        pin:
          description: The nearest active pin on the file or a folder above it.
          oneOf:
            - type: "null"
            - type: object
              required: [pin_id, tier, until, override_archive, set_at, set_by, reason, inherited_from]
              properties:
                pin_id: { $ref: "#/components/schemas/Id" }
                tier: { $ref: "#/components/schemas/PinTier" }
                until: { type: [string, "null"], format: date-time }
                override_archive: { type: boolean }
                set_at: { type: string, format: date-time }
                set_by: { oneOf: [{ $ref: "#/components/schemas/PersonRef" }, { type: "null" }], description: "ArchiveAdmin, DataSteward, the share's Owners, and the person who set it; null for others." }
                reason: { type: [string, "null"], description: "ArchiveAdmin, DataSteward and the share's Owners; null for others." }
                inherited_from: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        holds:
          type: array
          description: The active holds on the file or a folder above it.
          items:
            type: object
            required: [hold_id, kind, until, set_at, set_by, reason, inherited_from]
            properties:
              hold_id: { $ref: "#/components/schemas/Id" }
              kind: { type: string, enum: [keep_online, legal] }
              until: { type: [string, "null"], format: date-time }
              set_at: { type: string, format: date-time }
              set_by: { oneOf: [{ $ref: "#/components/schemas/PersonRef" }, { type: "null" }], description: "ArchiveAdmin, DataSteward, the share's Owners, and the person who set it; null for others." }
              reason: { type: [string, "null"], description: "ArchiveAdmin, DataSteward and the share's Owners; null for others." }
              inherited_from: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }

    ShareMap:
      examples:
        - {"share_id": "4", "dataset_id": "2", "scope": "readable", "basis": "rollup", "computed_at": "2026-10-06T09:30:00.000Z", "home": {"backend_kind": "azure_blob", "storage_layout": "two_account"}, "source": {"backend_kind": "s3"}, "migration_state": "migrating", "edge": {"resident": {"files": 120, "bytes": 96000000000, "local_bytes": 96000000000}, "stub": {"files": 40, "bytes": 7360000000000, "local_bytes": 167772160}, "arriving": {"files": 2, "bytes": 18000000000, "local_bytes": 18000000000}, "remote": {"files": 300, "bytes": 1200000000000, "local_bytes": 0}}, "stores": [{"backend_kind": "azure_blob", "role": "home", "tiers": [{"logical_tier": "hot", "native_class": "Hot", "account": "live", "files": 80, "bytes": 64000000000}, {"logical_tier": "warm", "native_class": "Cool", "account": "live", "files": 40, "bytes": 32000000000}, {"logical_tier": "archive", "native_class": "Archive", "account": "archive", "files": 40, "bytes": 7360000000000}]}, {"backend_kind": "s3", "role": "source", "tiers": [{"logical_tier": "archive", "native_class": "GLACIER", "account": null, "files": 300, "bytes": 1200000000000}]}], "recalls": {"open": 3, "by_step": {"requested": 1, "rehydrating": 2, "downloading": 0}}, "migrations": null}
      type: object
      required: [share_id, dataset_id, scope, basis, computed_at, home, source, migration_state, edge, stores, recalls, migrations]
      properties:
        share_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        scope: { type: string, enum: [all, readable], description: "all: every file under the share, counts only (ArchiveAdmin, DataSteward). readable: only files the caller can read, in folders it can read." }
        basis: { type: string, x-extensible-enum: [rollup, counting, none], description: "rollup: summed from the worker's roll-up, true as of computed_at (both scopes). counting: a folder it would sum hasn't been counted yet, so there is no total, never a total of zero. none: the count for scope readable ran out of time. With counting or none, edge is null and stores empty." }
        computed_at: { type: [string, "null"], format: date-time, description: "The time the counts are true as of: the oldest count summed among folders with a change waiting, now for the rest. null unless basis is rollup." }
        home:
          type: object
          required: [backend_kind, storage_layout]
          properties:
            backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
            storage_layout: { type: string, x-extensible-enum: [two_account, single_account] }
        source:
          description: The migration source, while the dataset has one.
          oneOf:
            - type: "null"
            - type: object
              required: [backend_kind]
              properties:
                backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
        migration_state: { type: string, x-extensible-enum: [steady, migrating, cut_over] }
        edge:
          type: [object, "null"]
          required: [resident, stub, arriving, remote]
          description: "What the edge holds, by file.state: resident (whole), stub (stub or being filled), arriving (landing or uploading), remote (never local). null with basis none."
          properties:
            resident: { $ref: "#/components/schemas/MapCount" }
            stub: { $ref: "#/components/schemas/MapCount" }
            arriving: { $ref: "#/components/schemas/MapCount" }
            remote: { $ref: "#/components/schemas/MapCount" }
        stores:
          type: array
          description: Primary copies per backend (home first), then per tier, warmest first.
          items:
            type: object
            required: [backend_kind, role, tiers]
            properties:
              backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
              role: { type: string, x-extensible-enum: [home, source, other] }
              tiers:
                type: array
                items:
                  type: object
                  required: [logical_tier, native_class, account, files, bytes]
                  properties:
                    logical_tier: { type: [string, "null"], x-extensible-enum: [hot, warm, cold, archive, smart] }
                    native_class: { type: [string, "null"] }
                    account: { type: [string, "null"], x-extensible-enum: [live, archive, single] }
                    files: { type: integer, minimum: 0 }
                    bytes: { type: integer, minimum: 0 }
        recalls:
          type: [object, "null"]
          required: [open, by_step]
          description: Always live. null only when a readable count ran out of time.
          properties:
            open: { type: integer, minimum: 0 }
            by_step:
              type: object
              required: [requested, rehydrating, downloading]
              properties:
                requested: { type: integer, minimum: 0 }
                rehydrating: { type: integer, minimum: 0 }
                downloading: { type: integer, minimum: 0 }
        migrations:
          description: "The dataset's open migrations; ArchiveAdmin only (null for others)."
          oneOf:
            - type: "null"
            - type: array
              items:
                type: object
                required: [migration_id, state, prefix, files]
                properties:
                  migration_id: { $ref: "#/components/schemas/Id" }
                  state: { type: string, x-extensible-enum: [pending, copying, verifying, verified] }
                  prefix: { type: string }
                  files:
                    type: object
                    required: [total, verified]
                    properties:
                      total: { type: [integer, "null"] }
                      verified: { type: integer, minimum: 0 }

    MapFile:
      type: object
      required: [file_id, name, parent_id, size, state, resident_bytes, tier]
      properties:
        file_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        parent_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        size: { type: integer, minimum: 0 }
        state: { type: string, x-extensible-enum: [landing, uploading, resident, stub, recalling, remote] }
        resident_bytes: { type: integer, minimum: 0 }
        tier: { $ref: "#/components/schemas/TierState" }

    Problem:
      examples:
        - {"type": "urn:omnifile:error:name_taken", "title": "Name taken", "status": 409, "code": "name_taken", "detail": "'line_1042-restored.segy' already exists in that folder", "retryable": false, "retry_after_s": null, "request_id": "5f0c1e9a2b3c4d5e6f708192a3b4c5d6"}
      type: object
      required: [type, title, status, code, retryable]
      properties:
        type: { type: string, description: "urn:omnifile:error:<code>" }
        title: { type: string }
        status: { type: integer }
        code:
