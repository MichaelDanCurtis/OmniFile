    SourceState:
      type: string
      enum: [registered, seeding, seeded, failed]

    SourceInventory:
      description: >-
        Where seeding reads the source's objects, by `kind` (catalog-seeding.md section 7).
        More kinds may follow (Azure Blob Inventory, a NAS snapshot listing).
      oneOf:
        - $ref: "#/components/schemas/SourceInventoryS3Metadata"
        - $ref: "#/components/schemas/SourceInventoryS3Inventory"
        - $ref: "#/components/schemas/SourceInventoryListing"
      discriminator:
        propertyName: kind
        mapping:
          s3_metadata: "#/components/schemas/SourceInventoryS3Metadata"
          s3_inventory: "#/components/schemas/SourceInventoryS3Inventory"
          listing: "#/components/schemas/SourceInventoryListing"

    SourceInventoryS3Metadata:
      type: object
      additionalProperties: false
      required: [kind, table_bucket_arn]
      description: >-
        The bucket's S3 Metadata tables in the account's `aws-s3` table bucket, in the
        backend's region: seeded from the live inventory table and kept current from the
        journal. Endpoints and credentials are the backend's, never the request's.
      properties:
        kind: { type: string, const: s3_metadata }
        table_bucket_arn:
          type: string
          maxLength: 1024
          pattern: "^arn:aws[a-z-]*:s3tables:[a-z0-9-]+:[0-9]{12}:bucket/[a-z0-9][a-z0-9-]{1,61}$"
        namespace: { type: string, pattern: "^[a-z0-9_]{1,255}$", description: "Default b_<bucket>." }
        table: { type: string, pattern: "^[a-z0-9_]{1,255}$", description: "Default inventory." }
        journal_table: { type: string, pattern: "^[a-z0-9_]{1,255}$", description: "Default journal." }

    SourceInventoryS3Inventory:
      type: object
      additionalProperties: false
      required: [kind, bucket, manifest_key]
      description: A CSV S3 Inventory's manifest.
      properties:
        kind: { type: string, const: s3_inventory }
        bucket: { type: string, minLength: 1, maxLength: 1024 }
        manifest_key: { type: string, minLength: 1, maxLength: 1024 }

    SourceInventoryListing:
      type: object
      additionalProperties: false
      required: [kind]
      description: List the prefix, even if the bucket has S3 Metadata tables.
      properties:
        kind: { type: string, const: listing }

    SourceGroups:
      type: object
      additionalProperties: false
