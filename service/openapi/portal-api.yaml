        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnexRulesetPropose" }
      responses:
        "201":
          description: Proposed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnnexRuleset" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/rulesets/{version}:
    get:
      tags: [annex]
      operationId: getAnnexRuleset
      summary: One version, its body, its checks today and its dry run.
