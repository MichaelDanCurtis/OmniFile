            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annex" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}:
    get:
      tags: [annex]
      operationId: getAnnex
      parameters:
        - $ref: "#/components/parameters/AnnexId"
      responses:
        "200":
