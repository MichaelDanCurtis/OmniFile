          application/json:
            schema: { $ref: "#/components/schemas/AnnexPatch" }
      responses:
        "200":
          description: Changed.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annex" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes/{annex_id}/rulesets:
    get:
      tags: [annex]
      operationId: listAnnexRulesets
      summary: The annex's rule set versions, newest first.
      parameters:
        - $ref: "#/components/parameters/AnnexId"
      responses:
        "200":
          description: Versions.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AnnexRuleset" } }
