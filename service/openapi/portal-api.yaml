        writers: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }
        readers: { oneOf: [{ $ref: "#/components/schemas/Sid" }, { type: "null" }] }

    SourceCreate:
      type: object
      additionalProperties: false
      required: [dataset_id, groups]
      oneOf:
        - required: [backend_id, container]
          not: { required: [backend] }
        - required: [backend]
          not: { anyOf: [{ required: [backend_id] }, { required: [container] }] }
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        backend_id: { $ref: "#/components/schemas/Id", description: A backend an ArchiveAdmin configured. }
        container: { type: string, minLength: 1, maxLength: 1024, description: A bucket of that backend. }
        backend: { $ref: "#/components/schemas/InlineBackend", description: "Instead of backend_id and container (POST /v1/sources only): the bucket and its region, to find the backend an ArchiveAdmin configured for it." }
        prefix: { type: string, maxLength: 1024, description: "'' (the whole bucket) or ending in '/'." }
        path: { type: string, maxLength: 1024, description: "The dataset folder the objects appear under; '' = the root." }
        inventory: { oneOf: [{ $ref: "#/components/schemas/SourceInventory" }, { type: "null" }], description: "Absent or null - the bucket's S3 Metadata tables if its backend names them, else list the prefix." }
        groups: { $ref: "#/components/schemas/SourceGroups" }

