              bytes: { type: integer }
              restore_needed: { type: boolean }
        restore:
          type: object
          required: [objects, bytes, waves, hours, request_seconds, cost, currency, prices_set, notes]
          properties:
            objects: { type: integer }
            bytes: { type: integer }
            waves: { type: integer }
            hours: { type: [number, "null"], description: "AWS's stated Bulk time for the slowest class to restore (per wave)." }
            request_seconds: { type: number, description: "Time to send the restore requests at the shared 1,000 a second." }
            cost: { type: [string, "null"], description: "Decimal; null when no S3 prices are set." }
            currency: { type: [string, "null"] }
            prices_set: { type: boolean }
            notes: { type: array, items: { type: string } }
        large_objects:
          type: object
          required: [objects, bytes]
          description: Objects over 10 GiB. No restore or copy time is promised for these.
          properties:
            objects: { type: integer }
            bytes: { type: integer }
        waves:
          type: array
          items:
            type: object
            required: [wave, prefixes, objects, bytes, restore_objects, restore_bytes, copy_only]
            properties:
              wave: { type: integer }
              prefixes: { type: array, items: { type: string } }
              objects: { type: integer }
              bytes: { type: integer }
              restore_objects: { type: integer }
              restore_bytes: { type: integer }
              copy_only: { type: boolean, description: Nothing here needs a restore. }

    SourceScan:
      type: object
      required: [scan_id, state, detail, backend_id, bucket, prefix, reader, caps, progress, result, created_at, finished_at]
      properties:
        scan_id: { $ref: "#/components/schemas/Id" }
        state: { type: string, x-extensible-enum: [pending, running, done, capped, failed] }
        detail: { type: [string, "null"] }
        backend_id: { $ref: "#/components/schemas/Id" }
        bucket: { type: string }
        prefix: { type: string }
        reader: { type: string, x-extensible-enum: [listing, s3_inventory] }
        caps:
          type: object
          required: [max_objects, max_seconds]
          properties:
            max_objects: { type: integer }
            max_seconds: { type: integer }
        progress:
          type: object
          required: [objects, bytes, batches, elapsed_s]
          properties:
            objects: { type: integer }
            bytes: { type: integer }
            batches: { type: integer }
            elapsed_s: { type: number }
        result: { oneOf: [{ $ref: "#/components/schemas/SourceScanResult" }, { type: "null" }] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }

    AlertSettings:
      type: object
      required: [alerts, where]
      properties:
        where: { type: string, description: Where the rules live and fire. }
        alerts:
          type: array
          items:
            type: object
            required: [name, condition, status, detail]
            properties:
              name: { type: string }
              condition: { type: string }
              status: { type: string, x-extensible-enum: [ok, firing, unknown] }
              detail: { type: string }

    ApiClientOwner:
      type: object
      required: [identity_id, display_name, upn, roles, roles_seen_at]
      properties:
        identity_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: [string, "null"] }
        upn: { type: [string, "null"] }
        roles: { type: array, items: { type: string }, description: "The app roles they held at their last portal sign-in." }
        roles_seen_at: { type: [string, "null"], format: date-time }

    ApiClient:
      examples:
        - {"api_client_id": "3", "app_id": "6f1c2d3e-4a5b-4c6d-8e7f-001122334455", "display_name": "Migration planner", "scopes": ["Policy.Propose", "Archive.Read"], "owner": {"identity_id": "11", "display_name": "Ada Admin", "upn": "ada@contoso.com", "roles": ["ArchiveAdmin"], "roles_seen_at": "2026-10-06T09:00:00.000Z"}, "state": "enabled", "created_by": {"kind": "identity", "display_name": "Ada Admin", "app_id": null, "identity_id": "11"}, "created_at": "2026-10-06T09:30:00.000Z", "updated_at": "2026-10-06T09:30:00.000Z", "disabled_at": null, "revoked_at": null, "last_used_at": null, "etag": "\"1\""}
      type: object
      required: [api_client_id, app_id, display_name, scopes, owner, state, created_by, created_at, updated_at, disabled_at, revoked_at, last_used_at, etag]
      properties:
        api_client_id: { $ref: "#/components/schemas/Id" }
        app_id: { type: string, description: The Entra application (client) id its tokens carry as azp. }
        display_name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [Policy.Propose, Recall.Request, Archive.Read, Archive.Adopt] }
          description: The app roles it may use here. A role its token carries but this list lacks is ignored.
        owner: { $ref: "#/components/schemas/ApiClientOwner" }
        state: { type: string, x-extensible-enum: [enabled, disabled, revoked] }
        created_by: { $ref: "#/components/schemas/PersonRef" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        disabled_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        etag: { type: string }
        keys: { type: array, items: { $ref: "#/components/schemas/ApiKey" }, description: "Its OmniFile API keys, newest first (never the keys themselves)." }

    ApiClientCreate:
      type: object
      additionalProperties: false
      required: [app_id, display_name, scopes, owner_identity_id]
      properties:
        app_id: { type: string, maxLength: 64, description: "The Entra application (client) id, a GUID." }
        display_name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [Policy.Propose, Recall.Request, Archive.Read, Archive.Adopt] }
        owner_identity_id: { $ref: "#/components/schemas/Id" }

    ApiClientPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 80 }
        scopes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [Policy.Propose, Recall.Request, Archive.Read, Archive.Adopt] }
        owner_identity_id: { $ref: "#/components/schemas/Id" }
        enabled: { type: boolean }

    ApiClientSetup:
      type: object
      required: [tenant_id, token_endpoint, scope, audiences, app_roles, steps]
      description: How a client gets a token. OmniFile makes and stores no key; the client uses its own Entra app credential, a certificate by preference.
      properties:
        tenant_id: { type: string }
        token_endpoint: { type: string }
        scope: { type: [string, "null"], description: "What to request in client credentials: <application ID URI>/.default" }
        audiences: { type: array, items: { type: string } }
        app_roles: { type: array, items: { type: string } }
        steps: { type: array, items: { type: string } }

    ApiClientRef:
      type: object
      required: [api_client_id, display_name, app_id, owner]
      description: The API client a proposal came from, and its owner.
      properties:
        api_client_id: { $ref: "#/components/schemas/Id" }
        display_name: { type: string }
        app_id: { type: string }
        owner: { $ref: "#/components/schemas/PersonRef" }

    ApiKey:
      type: object
      required: [key_id, scopes, state, created_at, created_by, expires_at, revoked_at, rotated_from, last_used_at, last_used_addr]
      description: An OmniFile API key, as listed. Never the key itself; only its public id.
      properties:
        key_id: { type: string, pattern: "^[0-9a-f]{16}$", description: "The public part of ofk1.<key_id>.<secret>; the audit records it." }
        scopes: { type: array, items: { type: string, enum: [Policy.Propose, Recall.Request, Archive.Read, Archive.Adopt] } }
        state: { type: string, x-extensible-enum: [active, expired, revoked] }
        created_at: { type: string, format: date-time }
        created_by: { $ref: "#/components/schemas/PersonRef" }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        rotated_from: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
        last_used_addr: { type: [string, "null"], description: The address of its latest use. }

    ApiKeyIssued:
      type: object
      required: [key, api_key]
      properties:
        key:
          type: string
          pattern: "^ofk1\\.[0-9a-f]{16}\\.[A-Za-z0-9_-]{43}$"
          description: "Send as `Authorization: Bearer <key>`, never in a URL. Shown once; the catalog keeps only its SHA-256."
        api_key: { $ref: "#/components/schemas/ApiKey" }
        previous: { $ref: "#/components/schemas/ApiKey", description: "Rotation only: the old key, with its shortened expiry." }

    ApiKeyCreate:
      type: object
      additionalProperties: false
      properties:
        scopes:
          type: array
          uniqueItems: true
          items: { type: string, enum: [Policy.Propose, Recall.Request, Archive.Read, Archive.Adopt] }
          description: Within the client's scopes; default, all of them.
        expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }

    ApiKeyRotate:
      type: object
      additionalProperties: false
      properties:
        expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
        overlap_hours: { type: integer, minimum: 0, maximum: 720, default: 168, description: How long the old key keeps working. }
