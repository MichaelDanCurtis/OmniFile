  /v1/migration-plans/{plan_id}/waves/{seq}/retry:
    post:
      tags: [sources]
      operationId: retryMigrationWave
      summary: Retry a wave's failed migrations (back to pending); the only way to retry a plan's migration.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/WaveSeq"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/migration-plans/{plan_id}/waves/{seq}/cancel:
    post:
      tags: [sources]
      operationId: cancelMigrationWave
      summary: Cancel a wave's migrations not cut over; nothing is deleted. The only way to cancel a plan's migration.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/PlanId"
        - $ref: "#/components/parameters/WaveSeq"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MigrationPlan" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/recall-batches:
    post:
      tags: [recalls]
      operationId: createRecallBatch
      summary: Recall paths, or a whole dataset, by a due date (portal-api.md 5.19). Apps with Recall.Request.
      security:
        - partnerToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecallBatchCreate" }
      responses:
        "202":
          description: Accepted; small batches are already planned (ETA and cost), large ones are planned by the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallBatch" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/recall-batches/{batch_id}:
    get:
      tags: [recalls]
      operationId: getRecallBatch
      summary: The batch and a page of its planned files. The app that made it only.
      security:
        - partnerToken: []
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/Id" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The batch, with items and next_cursor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecallBatch" }
        default: { $ref: "#/components/responses/Problem" }

  # --- Visual views (portal-api.md 5.22; WP13) -----------------------------------------------

  /v1/files/{file_id}/journey:
    get:
      tags: [visual]
      operationId: getFileJourney
      summary: The tiers of the backend that holds the file, which account holds it, and the pin and holds that apply (portal-api.md 5.22). Read on the file.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: The file's journey.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileJourney" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/map:
    get:
      tags: [visual]
      operationId: getShareMap
      summary: Files and bytes under the share, on the edge and per backend, account and tier, with recalls and migrations in flight (portal-api.md 5.22).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
      responses:
        "200":
          description: "The map. scope: all (counts only) for ArchiveAdmin and DataSteward, readable for everyone else."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShareMap" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/shares/{share_id}/map/files:
    get:
      tags: [visual]
      operationId: listShareMapFiles
      summary: The readable files, in readable folders, behind one node of the share map, by file_id (portal-api.md 5.22). At least one of edge, tier or recalling.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/ShareId"
        - name: edge
          in: query
          schema: { type: string, enum: [resident, stub, arriving, remote] }
          description: "What the edge holds: resident (whole), stub (stub or being filled), arriving (landing or uploading), remote (never local)."
        - name: tier
          in: query
          schema: { type: string, enum: [hot, warm, cold, archive, smart] }
          description: The logical tier of the primary copy.
        - name: role
          in: query
          schema: { type: string, enum: [home, source] }
          description: With tier, the dataset's home backend or its migration source.
        - name: recalling
          in: query
          schema: { type: string, enum: ["true"] }
          description: Files with a recall in flight.
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Readable files, by file_id.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MapFile" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }

  /healthz:
    get:
      tags: [admin]
      operationId: healthz
      security: []
      responses:
        "200":
          description: Liveness.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }


  # --- Settings (portal-api.md 5.22) and API clients (5.21). ArchiveAdmin, session only.
  # Settings connect and check; they store no key, secret or password.

  /v1/settings/storage:
    get:
      tags: [settings]
      operationId: getStorageSettings
      summary: The storage backends, with what they are and what uses them (portal-api.md 5.22).
      security:
        - session: []
      responses:
        "200":
          description: Every backend, by id.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageSettings" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [settings]
      operationId: addStorageBackend
      summary: Add a storage backend, checked by the same code as the admin CLI (`omnifile_service.admin`). Re-auth within 10 minutes. Idempotent by name.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackendDraft" }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendChange" }
        "200":
          description: A backend of that name already holds these answers (unchanged), or was brought to them (updated).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendChange" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/storage/{backend_id}:
    put:
      tags: [settings]
      operationId: editStorageBackend
      summary: Edit a backend. Once data uses it, only S3 buckets may be added. Never turns private networking off. Re-auth within 10 minutes.
      security:
        - session: []
      parameters:
        - { name: backend_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackendDraft" }
      responses:
        "200":
          description: Updated or unchanged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendChange" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/storage/{backend_id}/checks:
    get:
      tags: [settings]
      operationId: checkStorageBackend
      summary: Live checks of one backend - private DNS, the service's RBAC role, the live/archive pair and change feed, or for S3 the role (portal-api.md 5.22).
      security:
        - session: []
      parameters:
        - { name: backend_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The checks, run now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackendChecks" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws:
    get:
      tags: [settings]
      operationId: getAwsSettings
      summary: The service's AWS settings - accounts, roles and the web-identity audience (decision 43). No keys anywhere.
      security:
        - session: []
      responses:
        "200":
          description: What the deployment configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/trust-policy:
    get:
      tags: [settings]
      operationId: getAwsTrustPolicy
      summary: The exact trust policy to give the pasted role, federating the service's Entra identity (decision 43). Nothing is stored.
      security:
        - session: []
      parameters:
        - name: role_arn
          in: query
          required: true
          schema: { type: string, pattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$" }
      responses:
        "200":
          description: The trust policy and the steps.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsTrustPolicy" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/test:
    post:
      tags: [settings]
      operationId: testAwsRole
      summary: The worker calls AssumeRoleWithWebIdentity for the role with the service's identity and reports the result. Poll GET /v1/settings/tests/{test_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_arn]
              properties:
                role_arn: { type: string, pattern: "^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,512}$" }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/identity:
    get:
      tags: [settings]
      operationId: getIdentitySettings
      summary: The tenant, the app roles and the AD groups that hold them, and admin-consent status with its link.
      security:
        - session: []
      responses:
        "200":
          description: The tenant's settings, read now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentitySettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/identity/whoami:
    get:
      tags: [settings]
      operationId: whoAmI
      summary: Who the portal thinks you are, and the checks that follow from it (SID, groups, roles, re-auth).
      security:
        - session: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/teams:
    get:
      tags: [settings]
      operationId: getTeamsSettings
      summary: The Teams bot's health from recent cards, and the app package.
      security:
        - session: []
      responses:
        "200":
          description: Teams, as configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamsSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/teams/package:
    get:
      tags: [settings]
      operationId: getTeamsPackage
      summary: The Teams app package deploy/teams/build.sh made, when the service can reach it (`404 not_found` otherwise; the settings page says how to build it).
      security:
        - session: []
      responses:
        "200":
          description: The zip.
          content:
            application/zip:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/teams/test-card:
    post:
      tags: [settings]
      operationId: sendTestCard
      summary: Send yourself a test card through the worker's notify path. Poll GET /v1/settings/tests/{test_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/email:
    get:
      tags: [settings]
      operationId: getEmailSettings
      summary: The fallback email's sender mailbox and recent sends.
      security:
        - session: []
      responses:
        "200":
          description: Email, as configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/email/test:
    post:
      tags: [settings]
      operationId: sendTestEmail
      summary: Send yourself a test email from the sender mailbox, through the worker. Poll GET /v1/settings/tests/{test_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/tests/{test_id}:
    get:
      tags: [settings]
      operationId: getSettingsTest
      summary: A test send or role assumption you asked for, and how it went.
      security:
        - session: []
      parameters:
        - { name: test_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The test.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsTest" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/storage-mover:
    get:
      tags: [settings]
      operationId: getStorageMoverSettings
      summary: Azure Storage Mover's agents and projects with their status, read-only, through the ARM API the migration engine uses.
      security:
        - session: []
      responses:
        "200":
          description: Storage Mover, read now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageMoverSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/azure:
    get:
      tags: [settings]
      operationId: getAzureSettings
      summary: Connect Azure (cloud-connect.md 1) - what the admin listed and chose, the grants planned and made, what was discovered and confirmed, and the steps still to do.
      security:
        - session: []
      responses:
        "200":
          description: The connection, read now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AzureSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/azure/sign-in:
    post:
      tags: [settings]
      operationId: startAzureSignIn
      summary: Start a delegated sign-in to Azure Resource Manager (auth code + PKCE). purpose list reads the tenants, subscriptions and resource groups; grant makes the planned grants; remove removes the named ones. The token is used in the callback and dropped.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [list, grant, remove] }
                grant_ids: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/Id" }, description: "remove only: the grants to remove." }
      responses:
        "201":
          description: Go to authorize_url (a top-level navigation). Sets __Host-omnifile_azure (SameSite=Lax).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AzureSignIn" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/azure/callback:
    get:
      tags: [auth]
      operationId: azureConnectCallback
      summary: Entra redirects here after a Connect Azure sign-in. Redeems the code, checks the ID token is the admin who started it, does the operation's work with the access token, and redirects to /settings/azure.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302":
          description: Back to /settings/azure?op=<op_id>. The operation's outcome is in GET /v1/settings/azure (last_op).
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }

  /v1/settings/azure/choice:
    put:
      tags: [settings]
      operationId: putAzureChoice
      summary: Choose the subscription and resource groups (from the latest listing), and optionally the resource group for Storage Mover. Returns the plan of grants; nothing is granted yet.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscription_id, resource_groups]
              properties:
                subscription_id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
                resource_groups: { type: array, minItems: 1, maxItems: 20, items: { type: string, minLength: 1, maxLength: 90 } }
                mover_resource_group: { type: [string, "null"], maxLength: 90 }
      responses:
        "200":
          description: The connection, with the new plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AzureSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/azure/discover:
    post:
      tags: [settings]
      operationId: discoverAzure
      summary: Read the storage accounts, VNets, private endpoints and storage movers in the granted resource groups, with the service's own identity.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: The connection, with what was found.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AzureSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/azure/confirm:
    post:
      tags: [settings]
      operationId: confirmAzure
      summary: Confirm which discovered resources OmniFile uses (by resource id). Audited. It doesn't register backends; Storage does.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [storage_accounts]
              properties:
                storage_accounts: { type: array, maxItems: 100, items: { type: string, maxLength: 512 } }
                virtual_networks: { type: array, maxItems: 100, items: { type: string, maxLength: 512 } }
                private_endpoints: { type: array, maxItems: 500, items: { type: string, maxLength: 512 } }
      responses:
        "200":
          description: The connection, confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AzureSettings" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/connect:
    get:
      tags: [settings]
      operationId: getAwsConnect
      summary: Connect AWS (cloud-connect.md 2) - the CloudFormation quick-create link with this deployment's values, the template's parameters, the steps, and the accounts connected so far.
      security:
        - session: []
      parameters:
        - { name: region, in: query, schema: { type: string, pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$" } }
        - { name: deployment_id, in: query, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,19}$" } }
      responses:
        "200":
          description: What to launch.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnect" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/connect/template:
    get:
      tags: [settings]
      operationId: getAwsConnectTemplate
      summary: The CloudFormation template (deploy/aws/cloudformation/omnifile-connect.yaml), for the console's "Upload a template file" when no quick-create link is configured.
      security:
        - session: []
      responses:
        "200":
          description: The template.
          content:
            application/yaml:
              schema: { type: string }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/connect/fetch:
    post:
      tags: [settings]
      operationId: fetchAwsConnect
      summary: After the stack is made - the worker assumes the new role with its web identity and reads the account's buckets and the event queue. Read-only, credentials never stored. Poll GET /v1/settings/tasks/{task_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, region, deployment_id]
              properties:
                account_id: { type: string, pattern: "^[0-9]{12}$" }
                region: { type: string, pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$" }
                deployment_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,19}$" }
                endpoints:
                  type: object
                  additionalProperties: false
                  description: "With private networking: the stack's interface endpoint outputs (https://<dns>)."
                  properties:
                    s3: { type: string, maxLength: 300 }
                    sts: { type: string, maxLength: 300 }
                    sqs: { type: string, maxLength: 300 }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudTask" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/connect/outputs:
    post:
      tags: [settings]
      operationId: parseAwsOutputs
      summary: The fallback - the stack's outputs pasted by hand (the console's Outputs tab, describe-stacks JSON, or Key=Value lines), turned into the account's settings entry. Nothing is called or stored.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                text: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: What the outputs say.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnectEntry" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/aws/connect/confirm:
    post:
      tags: [settings]
      operationId: confirmAwsConnect
      summary: Confirm the account's settings entry (from a fetch or pasted outputs) and the buckets. Recorded and audited; the entry is then set in the deployment (OMNIFILE_AWS_ACCOUNTS), never in the catalog (cloud-connect.md 2.3).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, region, deployment_id, outputs, buckets]
              properties:
                account_id: { type: string, pattern: "^[0-9]{12}$" }
                region: { type: string, pattern: "^[a-z]{2}(-[a-z]+)+-[0-9]$" }
                deployment_id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,19}$" }
                outputs: { type: object, maxProperties: 30, additionalProperties: { type: string, maxLength: 2048 } }
                buckets: { type: array, maxItems: 100, items: { type: string, pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$" } }
      responses:
        "200":
          description: Recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AwsConnection" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/storage-mover/deploy:
    post:
      tags: [settings]
      operationId: deployStorageMover
      summary: Create the Storage Mover and its project in the resource group chosen in Connect Azure, by the worker with its granted role (cloud-connect.md 3). Poll GET /v1/settings/tasks/{task_id}.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, project, location]
              properties:
                name: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$" }
                project: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,62}$" }
                location: { type: string, pattern: "^[a-z0-9]{3,30}$" }
      responses:
        "202":
          description: Queued for the worker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudTask" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/tasks/{task_id}:
    get:
      tags: [settings]
      operationId: getCloudTask
      summary: A task the worker runs for Settings (an AWS fetch, a Storage Mover deployment), and how it went.
      security:
        - session: []
      parameters:
        - { name: task_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloudTask" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/alerts:
