        default: { $ref: "#/components/responses/Problem" }

  /v1/edges/{edge_id}/revoke:
    post:
      tags: [admin]
      operationId: revokeEdge
      summary: A lost or stolen filer stops working at once - its certificate is refused and it can't renew; its data stays (portal-api.md 5.15). ArchiveAdmin, re-auth within 10 minutes. One-way.
      security:
        - session: []
      parameters:
        - { name: edge_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
