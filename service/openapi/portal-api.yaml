        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnexDecision" }
      responses:
        "200":
          description: Rejected.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Annex" }
        default: { $ref: "#/components/responses/Problem" }

