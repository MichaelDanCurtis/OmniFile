  /v1/settings/api-clients/{api_client_id}:
    get:
      tags: [settings]
      operationId: getApiClient
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiClient" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [settings]
      operationId: editApiClient
      summary: Rename, change scopes or owner, disable or enable. Disabling takes effect on the client's next call and needs no re-auth; anything else does.
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiClientPatch" }
      responses:
        "200":
          description: The client after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiClient" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/api-clients/{api_client_id}/revoke:
    post:
      tags: [settings]
      operationId: revokeApiClient
      summary: Revoke a client for good; its calls are refused from the next one. Its proposals and audit records stay.
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200":
          description: Revoked (or already was).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiClient" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/api-clients/{api_client_id}/keys:
    post:
      tags: [settings]
      operationId: createApiKey
      summary: An OmniFile API key for the client, shown once and kept only as a hash (portal-api.md 5.21). Entra app credentials stay the recommended way. Re-auth within 10 minutes. Never replayed from the idempotency store.
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: The key. Copy it now; it is never shown again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyIssued" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/api-clients/{api_client_id}/keys/{key_id}/rotate:
    post:
      tags: [settings]
      operationId: rotateApiKey
      summary: A new key with the same scopes; the old one keeps working until the overlap ends (7 days by default), then expires. Re-auth within 10 minutes.
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: key_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{16}$" } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyRotate" }
      responses:
        "201":
          description: The new key, shown once, and the old key's new expiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyIssued" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/settings/api-clients/{api_client_id}/keys/{key_id}/revoke:
    post:
      tags: [settings]
      operationId: revokeApiKey
      summary: Revoke a key at once; its next call is refused. Needs no re-auth.
      security:
        - session: []
      parameters:
        - { name: api_client_id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: key_id, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{16}$" } }
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        "200":
          description: Revoked (or already was).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKey" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/filers:
    get:
      tags: [annex]
      operationId: listFilers
      summary: Registered NAS filers (portal-api.md 5.23).
      responses:
        "200":
          description: Filers by name.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Filer" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [annex]
      operationId: addFiler
      summary: Register a NAS (any NFS or SMB server) on an edge. ArchiveAdmin.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FilerCreate" }
      responses:
        "201":
          description: Registered.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Filer" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/filers/{filer_id}:
    get:
      tags: [annex]
      operationId: getFiler
      parameters:
        - $ref: "#/components/parameters/FilerId"
      responses:
        "200":
          description: The filer.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Filer" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [annex]
      operationId: patchFiler
      summary: >-
        Which account places files on this NAS (`placement_sid`), or null to clear it. Every SMB
        filer needs it. ArchiveAdmin, freshly signed in, with If-Match, audited. Only the SID this
        filer's own edge currently reports, of a user or machine account. A 400 names which it
        wasn't - well_known, no_report, stale_report (over 6 hours), different_sid,
        not_an_account, not_smb.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/FilerId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              description: >-
                At least one of `placement_sid` and `access`. `access` (decision 65) answers
                whether the filer's share or export limits access beyond the files'
                permissions: `{limited: true, groups}` with the AD groups it lets in, or
                `{limited: false}`. Recorded with who answered and when, and audited
                (`filer.access`); an annexed file's readers are only those it lets in, and
                an unanswered filer's files are hidden from everyone.
              properties:
                placement_sid: { type: [string, "null"] }
                access:
                  type: object
                  additionalProperties: false
                  required: [limited]
                  properties:
                    limited: { type: boolean }
                    groups: { type: array, maxItems: 100, items: { type: string } }
                acls_hidden_acknowledged:
                  type: boolean
                  enum: [true]
                  description: >-
                    Decision 64: an ArchiveAdmin acknowledges that the filer's NAS shows no
                    ACLs, so access there rests on mode bits alone; group-readable
                    placements and share copies of its files go on. Audited
                    (`filer.acls_hidden`). Only while the filer is flagged; a mount report
                    that the ACLs show clears the flag and this with it.
      responses:
        "200":
          description: The filer.
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Filer" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/filers/{filer_id}/health:
    get:
      tags: [annex]
      operationId: getFilerHealth
      summary: The edge's last mount check of the filer.
      parameters:
        - $ref: "#/components/parameters/FilerId"
      responses:
        "200":
          description: Health.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilerHealth" }
        default: { $ref: "#/components/responses/Problem" }

  /v1/annexes:
    get:
      tags: [annex]
      operationId: listAnnexes
      summary: The annexes the caller may see (portal-api.md 5.23).
      responses:
        "200":
          description: Annexes by name.
          content:
            application/json:
              schema:
