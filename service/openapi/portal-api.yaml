        rationale: { type: string, minLength: 1, maxLength: 4000 }
        base_version: { type: [integer, "null"] }
        share_overrides: { type: array, maxItems: 64, items: { $ref: "#/components/schemas/ShareOverride" }, description: "What users see, per share. Applied to the shares only when an ArchiveAdmin approves (anti-pattern 7)." }

    Proposal:
