        software_version: { type: [string, "null"] }
        kernel: { type: [string, "null"] }
        guard_state: { type: [string, "null"], description: "armed, degraded or down (open enum)" }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        certificate_not_after: { type: [string, "null"], format: date-time }
        health:
          type: object
          description: >-
            The heartbeat's gauges as last sent (control-api.md 4.7): outbox_depth, fills_running,
            recalls_waiting, data_free_bytes, data_capacity_bytes, fsal_connections,
            feed_lag_events, recovery_used (1 while the break-glass account was used and not
            sealed again), and others an edge may add.
          additionalProperties: { type: integer }
    Activity:
      type: object
      required: [from, to, dataset_id, days, uploads, recalls]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        dataset_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        days:
          type: array
          items:
            type: object
            required: [date, uploads, recalls]
            properties:
              date: { type: string, format: date }
              uploads:
                type: object
                required: [files, bytes]
                properties:
                  files: { type: integer }
                  bytes: { type: integer, format: int64 }
              recalls:
                type: object
                required: [started, available, failed]
                properties:
                  started: { type: integer }
                  available: { type: integer }
                  failed: { type: integer }
        uploads:
          type: object
          required: [files, bytes, unverified, landing]
          properties:
            files: { type: integer }
            bytes: { type: integer, format: int64 }
            unverified: { type: integer, description: Committed primary copies waiting for their read-back, now. }
            landing: { type: integer, description: Files still landing or uploading on an edge, now. }
        recalls:
          type: object
          required: [open, available, failed, bytes, time_to_available_s]
          properties:
            open: { type: integer }
            available: { type: integer }
            failed: { type: integer }
            bytes: { type: integer, format: int64 }
            time_to_available_s:
              type: object
              required: [p50, p90]
              properties:
                p50: { type: [integer, "null"] }
                p90: { type: [integer, "null"] }
    LiveEvent:
      type: object
      required: [id, at, kind, state, edge_id, edge_name, dataset_id, share_id, share_name,
                 file_id, name, path, hidden, bytes, person, detail]
      properties:
        id: { type: string, description: "Stable: the page drops an id it already shows." }
        at: { type: string, format: date-time }
        kind: { type: string, x-extensible-enum: [upload, recall, tier, heartbeat, migration, annex] }
        state:
          type: [string, "null"]
          description: >-
            recall: the state reached; tier: moved or refused; heartbeat: the guard state;
            migration: started, verified, cut_over, failed or cancelled; annex: the annex event's
            kind (arrived, copied, verified, left...). Open.
        edge_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        edge_name: { type: [string, "null"] }
        dataset_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        share_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }] }
        share_name: { type: [string, "null"] }
        file_id: { oneOf: [{ $ref: "#/components/schemas/Id" }, { type: "null" }], description: Null unless the caller may read the file. }
        name: { type: [string, "null"], description: Null unless the caller may read the file. }
        path: { type: [string, "null"], description: "From the share's root; an unreadable folder above shows as …. Null unless readable." }
        hidden: { type: boolean, description: "A file is involved that the caller may not read: no name, path or id." }
        bytes: { type: [integer, "null"], format: int64 }
        person:
          oneOf:
            - type: "null"
            - type: object
              required: [identity_id, display_name]
              properties:
                identity_id: { $ref: "#/components/schemas/Id" }
                display_name: { type: [string, "null"] }
        detail: { type: object, additionalProperties: true, description: "Per kind: recall_id, priority, via; migration_id, mode; annex_id, annex_name; from, to; software_version, outbox_depth." }
    LiveEdge:
      type: object
      required: [edge_id, name, status, last_heartbeat_at, uploads_15m, bytes_15m, recalls_open, outbox_depth]
      properties:
        edge_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        status: { type: string, description: "As in Edge: ok, attention, silent, pending (open)." }
        last_heartbeat_at: { type: [string, "null"], format: date-time }
        uploads_15m: { type: integer }
        bytes_15m: { type: integer, format: int64 }
        recalls_open: { type: integer }
        outbox_depth: { type: [integer, "null"] }
    LiveActivity:
      type: object
      required: [cursor, events, counters, series, edges, live]
      properties:
        cursor: { type: string, format: date-time, description: "The next poll's `since`." }
        events:
          type: array
          description: Newest first. Each source is read from `since` less 30 seconds, so a late commit still shows.
          items: { $ref: "#/components/schemas/LiveEvent" }
        counters:
          type: object
          required: [uploads_per_min, uploads_15m, bytes_moved_15m, recalls_in_flight, edges_online, edges_total]
          properties:
            uploads_per_min: { type: integer, description: Content versions committed by edges in the current minute. }
            uploads_15m: { type: integer }
            bytes_moved_15m: { type: integer, format: int64, description: Bytes uploaded plus bytes recalled (made available) in the last 15 minutes. }
            recalls_in_flight: { type: integer }
            edges_online: { type: integer, description: Enrolled edges heard from in the last 15 minutes. }
            edges_total: { type: integer, description: Enrolled edges. }
        series:
          type: object
          required: [from, step_s, uploads, bytes_moved]
          properties:
            from: { type: string, format: date-time }
            step_s: { type: integer }
            uploads: { type: array, items: { type: integer }, description: Per minute, oldest first; 30 values. }
            bytes_moved: { type: array, items: { type: integer, format: int64 } }
        edges:
          type: array
          items: { $ref: "#/components/schemas/LiveEdge" }
        live:
          type: object
          required: [waited, capped, next_poll_s]
          properties:
            waited: { type: boolean }
            capped: { type: boolean, description: "This replica holds as many polls as it allows: it answered at once." }
            next_poll_s: { type: integer, minimum: 2, description: Seconds to wait before the next poll; never under 2. }
    EdgeAppliance:
      type: object
      additionalProperties: false
      required: [release, images, checksums, enrolment_configured, code_ttl_s]
      properties:
        release: { type: [string, "null"], description: "The release (VERSION) this service is; null for a build that isn't one." }
        images:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [platform, file, url]
            properties:
              platform: { type: string, x-extensible-enum: [hyperv, vmware, kvm, azure] }
              file: { type: [string, "null"], description: "appliance/convert.sh's name for it: omnifile-edge_<release>.<vhdx|ova|qcow2|vhd>." }
              url:
                type: [string, "null"]
                description: >-
                  Only when the operator set OMNIFILE_APPLIANCE_IMAGES_URL. Otherwise null: the
                  files are in the release folder's appliance-files/.
        checksums: { type: [string, "null"], description: The SHA256SUMS file next to them, when published. }
        enrolment_configured: { type: boolean }
        code_ttl_s: { type: integer }

    Usage:
      examples:
        - {"computed_at": "2026-10-15T02:00:00.000Z", "datasets": [{"dataset_id": "2", "objects": 3, "bytes": 3221225472, "stored": [{"backend_id": "1", "backend_kind": "azure_blob", "role": "primary", "tier": "hot", "storage_class": "Hot", "objects": 2, "bytes": 2147483648, "monthly_cost": {"amount": "0.05", "currency": "USD"}}, {"backend_id": "7", "backend_kind": "s3", "role": "primary", "tier": "archive", "storage_class": "DEEP_ARCHIVE", "objects": 1, "bytes": 1073741824, "monthly_cost": null}], "monthly_cost": [{"amount": "0.05", "currency": "USD"}]}], "shares": [{"share_id": "4", "dataset_id": "2", "name": "seismic", "files": 3, "bytes": 3221225472, "by_tier": [{"tier": "hot", "files": 2, "bytes": 2147483648}, {"tier": "archive", "files": 1, "bytes": 1073741824}]}], "prices": [{"id": "azure_blob/eastus/2026-10-06", "backend_kind": "azure_blob", "region": "eastus", "as_of": "2026-10-06", "verify": true, "overridden": false}], "unpriced": ["s3: DEEP_ARCHIVE"]}
      type: object
      required: [computed_at, datasets, shares, prices, unpriced]
      properties:
        computed_at: { type: [string, "null"], format: date-time }
        datasets:
          type: array
          items:
            type: object
            required: [dataset_id, objects, bytes, stored, monthly_cost]
            properties:
              dataset_id: { $ref: "#/components/schemas/Id" }
              objects: { type: integer, minimum: 0 }
              bytes: { type: integer, minimum: 0 }
              stored:
                type: array
                description: Every committed copy (what the provider bills), older versions and recall copies included.
                items:
                  type: object
                  required: [backend_id, backend_kind, role, tier, storage_class, objects, bytes, monthly_cost]
                  properties:
                    backend_id: { $ref: "#/components/schemas/Id" }
                    backend_kind: { type: string, x-extensible-enum: [azure_blob, s3, sim] }
                    role: { type: string, x-extensible-enum: [primary, secondary, staging, recall_copy] }
                    tier: { oneOf: [{ $ref: "#/components/schemas/LogicalTier" }, { type: "null" }] }
                    storage_class: { type: [string, "null"] }
                    objects: { type: integer, minimum: 0 }
                    bytes: { type: integer, minimum: 0 }
                    monthly_cost: { oneOf: [{ $ref: "#/components/schemas/Money" }, { type: "null" }], description: Storage only; null when the price table has no gb_month for the class. }
              monthly_cost: { type: array, items: { $ref: "#/components/schemas/Money" }, description: One sum per currency, of the priced rows. }
        shares:
          type: array
          items:
            type: object
            required: [share_id, dataset_id, name, files, bytes, by_tier]
            properties:
              share_id: { $ref: "#/components/schemas/Id" }
              dataset_id: { $ref: "#/components/schemas/Id" }
              name: { type: string }
