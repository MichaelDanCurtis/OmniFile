                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Annex" } }
                  next_cursor: { $ref: "#/components/schemas/NextCursor" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [annex]
      operationId: addAnnex
      summary: An annex in Copy mode (the only mode in phase A1).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AnnexCreate" }
      responses:
        "201":
          description: Created; the edge's annex unit starts on its next poll.
