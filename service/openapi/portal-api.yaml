        journal_checked_through: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        cut_over_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        requested_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MigrationCreate:
      type: object
      additionalProperties: false
      required: [dataset_id, prefix]
      properties:
        dataset_id: { $ref: "#/components/schemas/Id" }
        prefix: { type: string, maxLength: 1024, description: "An S3 key prefix inside one of the dataset's seeded sources: '' or ending in '/'." }
        to_backend_id: { $ref: "#/components/schemas/Id", description: "Default and only value in v1: the dataset's own backend (decision 23)." }
        mode: { type: string, enum: [serve, hand_off], default: serve, description: hand_off is reserved (decision 35) and refused. }
        cutover: { type: string, enum: [auto, manual], default: auto, description: "auto - flip once every file is verified; manual - wait at verified for POST .../cutover." }
        copier: { type: string, enum: [auto, external], default: auto, description: "auto - the service runs Storage Mover; external - Prizmanyx copies to target_root + the S3 key and reports its runs." }

    Migration:
      examples:
        - {"migration_id": "5", "dataset_id": "2", "source_id": "3", "prefix": "raw/2019/", "from_backend_id": "7", "to_backend_id": "1", "to_container": "live/data", "target_root": "migrated/acme-seismic/", "mode": "serve", "cutover": "manual", "copier_kind": "external", "state": "verified", "files": {"total": 15000, "verified": 14998, "failed": 2, "excluded": 2}, "copier": {"job_ref": null, "last_run": {"run_ref": "pz-run-17", "state": "succeeded", "counters": {"copied": 15000}, "started_at": "2026-10-15T08:00:00.000Z"}, "runs_reported": 3}, "journal_checked_through": "2026-10-15T09:40:00.000Z", "verified_at": "2026-10-15T09:41:00.000Z", "cutover_requested_at": null, "cut_over_at": null, "cancelled_at": null, "source_deletes_pending": 4, "last_error": null, "created_by": "app:prizmanyx-app", "created_at": "2026-10-15T07:59:00.000Z", "updated_at": "2026-10-15T09:41:00.000Z"}
      type: object
      required: [migration_id, dataset_id, source_id, prefix, from_backend_id, to_backend_id, to_container, target_root, mode, cutover, copier_kind, state, files, copier, journal_checked_through, verified_at, cutover_requested_at, cut_over_at, cancelled_at, source_deletes_pending, last_error, created_by, created_at, updated_at]
      properties:
        migration_id: { $ref: "#/components/schemas/Id" }
        dataset_id: { $ref: "#/components/schemas/Id" }
        source_id: { $ref: "#/components/schemas/Id" }
        prefix: { type: string }
        from_backend_id: { $ref: "#/components/schemas/Id" }
        to_backend_id: { $ref: "#/components/schemas/Id" }
        to_container: { type: string }
        target_root: { type: string, description: "Copies land at target_root + the S3 key." }
        mode: { type: string, x-extensible-enum: [serve, hand_off] }
        cutover: { type: string, x-extensible-enum: [auto, manual] }
        copier_kind: { type: string, x-extensible-enum: [storage_mover, external], description: "Reserved for later: datasync, netapp_copy_sync, qumulo_shift, snapmirror (decision 35)." }
        state: { type: string, x-extensible-enum: [pending, copying, verifying, verified, cut_over, failed, cancelled] }
        files:
          type: object
          required: [total, verified, failed, excluded]
          properties:
            total: { type: [integer, "null"], description: Live files under the prefix, without the excluded ones. }
            verified: { type: integer }
            failed: { type: integer, description: Copies that failed their CRC64-NVME check (removed and copied again). }
            excluded: { type: integer, description: Objects an ArchiveAdmin excluded; they stay on the source. }
        stuck_copies:
          type: object
          description: Copies whose check won't end by itself, as the worker's sweep last counted them. Numbers only, and given_up is at most 5 minutes old; the other two are looked at when a prefix stalls, after an Exclude, and at least hourly otherwise. A new run revives none of them. Which objects they are is on /v1/migrations/{migration_id}/stuck-copies.
          required: [given_up, stranded, no_checksum]
          properties:
            given_up: { type: integer, description: Their check kept failing and went to the dead letters. An administrator sends them again. }
            stranded: { type: integer, description: Nothing is queued to check them, and there is no dead letter. }
            no_checksum: { type: integer, description: Their S3 objects have no checksum on record and nothing is computing one. Exclude them, or they hold up the cutover. }
        copier:
          type: object
