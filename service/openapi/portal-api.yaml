      tags: [admin]
      operationId: getLiveActivity
      summary: >-
        What happened since `since`, newest first, with live counters, per-minute series and a
        strip of the edges; a long-poll with `wait` (portal-api.md 5.13).
      security:
        - session: []
        - partnerToken: []
      parameters:
        - name: since
          in: query
          description: The previous answer's `cursor`. Absent, or older than 15 minutes, reads the last 15 minutes.
          schema: { type: string, format: date-time }
        - name: wait
          in: query
          description: With `since`, hold the request up to this many seconds until something newer exists.
          schema: { type: integer, minimum: 0, maximum: 25, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: kind
          in: query
          description: Comma-separated; default all of upload, recall, tier, heartbeat, migration, annex. Every filter applies before the limit.
          schema: { type: string }
        - name: edge_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: share_id
          in: query
          schema: { $ref: "#/components/schemas/Id" }
        - name: identity_id
          in: query
          description: Only what this person did. Sessions only; an application gets 400.
          schema: { $ref: "#/components/schemas/Id" }
      responses:
        "200":
          description: The events and the live numbers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveActivity" }
        default: { $ref: "#/components/responses/Problem" }

