                    items: { $ref: "#/components/schemas/Edge" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [admin]
      operationId: addEdge
      summary: A new edge, pending, and its one-time enrolment bundle for the edge's setup (portal-api.md 5.15).
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
