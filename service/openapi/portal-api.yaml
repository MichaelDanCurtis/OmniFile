                    state: { type: [string, "null"], x-extensible-enum: [running, succeeded, failed] }
                    counters: { type: object, additionalProperties: { type: integer } }
                    started_at: { type: [string, "null"], format: date-time }
            runs_reported: { type: integer, description: Runs an external copier reported. }
        journal_checked_through: { type: [string, "null"], format: date-time }
        verified_at: { type: [string, "null"], format: date-time }
        cutover_requested_at: { type: [string, "null"], format: date-time }
        cut_over_at: { type: [string, "null"], format: date-time }
        cancelled_at: { type: [string, "null"], format: date-time }
        source_deletes_pending: { type: integer, description: Rows of the cutover report (GET .../tombstones). }
        last_error: { type: [string, "null"] }
        plan:
          description: "The staged plan's wave that owns it (portal-api.md 5.22): its cutover, cancel and retry go through the plan's routes (409 otherwise)."
          oneOf:
            - type: "null"
            - type: object
              required: [plan_id, seq]
              properties:
                plan_id: { $ref: "#/components/schemas/Id" }
                seq: { type: integer }
        created_by: { type: string, description: "The audit actor that started it: app:<client id> or user:<identity id>." }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

