[project]
name = "omnifile-service"
version = "0.1.0"
description = "OmniFile Gateway service: control plane, catalog, policies, backends, portal API, Teams bot"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "starlette>=0.47",
    "uvicorn>=0.35",
    "azure-storage-blob[ext-checksums]>=12.31,<13",
    "azure-identity>=1.26,<2",
    # Container-level immutability policies (ARM) for WORM shares
    # (retention/policy_admin.py).
    "azure-mgmt-storage>=25.3,<26",
    "aiohttp>=3.10,<4",
    "fastavro>=1.9,<2",
    "psycopg-pool>=3.3,<4",  # kwargs as a callable: a fresh Entra token per connection
    "httpx>=0.28",
    "cryptography>=45",
    "pyjwt[crypto]>=2.10,<3",
    "aiobotocore>=2.22,<4",
    "zstandard>=0.23,<1",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b40",
    # S3 Metadata tables (Iceberg) for seeding (sources/metadata_s3.py).
    "pyiceberg[pyarrow,rest-sigv4]>=0.10,<1",
    "pyarrow>=18",
]

[project.optional-dependencies]
# Metrics over OTLP/gRPC to the Container Apps managed agent (metrics.py).
otlp = ["opentelemetry-exporter-otlp-proto-grpc>=1.30,<2"]

[dependency-groups]
dev = [
    "pytest>=8", "pytest-timeout>=2.3", "ruff>=0.6", "httpx>=0.28", "pyyaml>=6", "jsonschema>=4.23",
    # The local Iceberg catalog the Metadata-table tests stand in for S3 Tables with.
    "pyiceberg[sql-sqlite]>=0.10,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omnifile_service"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Three or more times the slowest test (test_portal_api_contract, about 65 s on an idle machine).
# The test body only: a hung test is the risk. A slow disk stalled a DROP DATABASE in a session
# fixture past 300 s once, and that would be charged to whichever test ran last.
timeout = 300
timeout_func_only = true
filterwarnings = [
    # Starlette asks for an `httpx2` package for its TestClient; httpx works and is what we ship.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
